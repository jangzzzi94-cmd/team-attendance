<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>팀 근태 · 벌금 관리</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --card2:#fbfcfd; --line:#e6e9ef; --line2:#d3d9e3;
  --tx:#171b23; --tx2:#5c6577; --tx3:#8b94a6;
  --pri:#2f6bff; --pri2:#1e55e0; --pri-soft:#eaf0ff;
  --ok:#0f9d58; --ok-soft:#e6f6ed;
  --warn:#c77700; --warn-soft:#fff3e0;
  --dan:#d92d20; --dan-soft:#fdeceb;
  --pur:#7c4dff; --pur-soft:#f0eaff;
  --cy:#0a8fa3; --cy-soft:#e3f6f9;
  --r:14px; --rs:10px;
  --sh:0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.07);
  --sh-s:0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#ccd2dc;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;align-items:center;gap:10px;min-height:56px;
}
.topbar .logo{font-weight:800;font-size:16px;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.topbar .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--pri)}
.topbar .sp{flex:1}
.chip-user{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);
  border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;font-weight:700;box-shadow:var(--sh-s)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--pri);display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 auto}
.main{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:16px 16px 104px}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  overflow-x:auto;scrollbar-width:none;box-shadow:0 -2px 12px rgba(16,24,40,.05);
}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 auto;min-width:60px;padding:7px 5px;border-radius:var(--rs);display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--tx3);font-size:10.5px;font-weight:700;
  transition:.15s;white-space:nowrap}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pri);background:var(--pri-soft)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  margin-bottom:12px;box-shadow:var(--sh-s)}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.3px}
.card-h .sp{flex:1}
.sec-t{font-size:12px;font-weight:800;color:var(--tx3);letter-spacing:.3px;margin:22px 0 10px}
.sec-t:first-child{margin-top:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}

/* ---------- stat ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh-s)}
.stat .lb{font-size:11.5px;color:var(--tx3);font-weight:700;margin-bottom:7px}
.stat .vl{font-size:23px;font-weight:800;letter-spacing:-1px;line-height:1.15}
.stat .sub{font-size:11.5px;color:var(--tx3);margin-top:5px}
.stat.acc-r{border-color:#f7c9c5;background:linear-gradient(180deg,var(--dan-soft),#fff)}
.stat.acc-r .vl{color:var(--dan)}
.stat.acc-g{border-color:#b8e3ca;background:linear-gradient(180deg,var(--ok-soft),#fff)}
.stat.acc-g .vl{color:var(--ok)}
.stat.acc-b{border-color:#c3d5ff;background:linear-gradient(180deg,var(--pri-soft),#fff)}
.stat.acc-b .vl{color:var(--pri)}
.stat.acc-p{border-color:#d9c9ff;background:linear-gradient(180deg,var(--pur-soft),#fff)}
.stat.acc-p .vl{color:var(--pur)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card);
  border:1px solid var(--line2);color:var(--tx);border-radius:var(--rs);padding:9px 14px;
  font-size:13.5px;font-weight:700;transition:.14s;white-space:nowrap;box-shadow:var(--sh-s)}
.btn:hover{background:#f7f9fc;border-color:#c2cad6}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2);border-color:var(--pri2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dan{background:var(--dan);border-color:var(--dan);color:#fff}
.btn.gho{background:transparent;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.xs{padding:4px 9px;font-size:11.5px;border-radius:7px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- forms ---------- */
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:6px}
.inp{width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--rs);
  padding:11px 13px;font-size:14.5px;transition:.14s;outline:none;color:var(--tx)}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.inp::placeholder{color:#a9b2c1}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235c6577' stroke-width='2.4' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
textarea.inp{resize:vertical;min-height:70px}
.hint{font-size:11.5px;color:var(--tx3);margin-top:5px;line-height:1.45}

/* ---------- badges ---------- */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;
  padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.bdg.b{background:var(--pri-soft);color:var(--pri);border-color:#cfdcff}
.bdg.g{background:var(--ok-soft);color:var(--ok);border-color:#bfe6cf}
.bdg.r{background:var(--dan-soft);color:var(--dan);border-color:#f7cdc9}
.bdg.y{background:var(--warn-soft);color:var(--warn);border-color:#ffe0b3}
.bdg.p{background:var(--pur-soft);color:var(--pur);border-color:#ddcdff}
.bdg.c{background:var(--cy-soft);color:var(--cy);border-color:#bfe9ef}
.bdg.n{background:#f0f2f6;color:var(--tx2);border-color:var(--line)}

.seg{display:flex;background:#eef1f6;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--tx2);transition:.14s}
.seg button.on{background:#fff;color:var(--pri);box-shadow:var(--sh-s)}
.seg.sm button{padding:6px 4px;font-size:11.5px}

.tpick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.tpick button{border:1.5px solid var(--line2);background:#fff;border-radius:var(--r);padding:14px 10px;
  text-align:left;transition:.15s}
.tpick button .tt{font-size:15px;font-weight:800;margin-bottom:3px}
.tpick button .td{font-size:11px;color:var(--tx3);line-height:1.4}
.tpick button.on{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px rgba(47,107,255,.1)}
.tpick button.on .tt{color:var(--pri)}
.tpick button:disabled{opacity:.45;cursor:not-allowed}

/* ---------- table ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;padding:10px 12px;font-size:11.5px;font-weight:800;color:var(--tx3);
  background:#f7f9fc;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfd}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:34px 16px;text-align:center;color:var(--tx3);font-size:13px}

.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .sp{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:14px}
.row .ds{font-size:11.5px;color:var(--tx3);margin-top:2px}

.rk{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;background:#eef1f6;color:var(--tx2);flex:0 0 auto}
.rk.r1{background:linear-gradient(135deg,#ffd66b,#f0a500);color:#4a2f00}
.rk.r2{background:linear-gradient(135deg,#e2e8f0,#b6c0cf);color:#2b3444}
.rk.r3{background:linear-gradient(135deg,#f0b787,#d08850);color:#3d2100}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:start}
.cal .dw{text-align:center;font-size:10.5px;font-weight:800;color:var(--tx3);padding:6px 0}
.cal .dw.s{color:var(--dan)}.cal .dw.u{color:var(--pri)}
.cel{min-height:64px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;
  display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.13s}
.cel:hover{border-color:var(--line2);background:#fafbfd}
.cel.off{background:#f4f6f9;opacity:.7}
.cel.tod{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.cel.hol{background:#fff7f6}
.cel .dn{font-size:11px;font-weight:800;color:var(--tx2)}
.cel .dn.s{color:var(--dan)}.cel .dn.u{color:var(--pri)}
.cel .ev{font-size:9.5px;font-weight:700;padding:2px 4px;border-radius:4px;line-height:1.35;
  white-space:normal;word-break:break-all}
.ev.r{background:var(--dan-soft);color:var(--dan)}
.ev.y{background:var(--warn-soft);color:var(--warn)}
.ev.g{background:var(--ok-soft);color:var(--ok)}
.ev.p{background:var(--pur-soft);color:var(--pur)}
.ev.b{background:var(--pri-soft);color:var(--pri)}
@media(max-width:560px){.cel{min-height:52px;padding:3px}.cel .ev{font-size:8px;padding:1px 3px}}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.45);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .16s}
@keyframes fi{from{opacity:0}}
.mod{background:#fff;border-radius:18px;width:100%;max-width:480px;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(16,24,40,.25);animation:su .2s cubic-bezier(.2,.9,.3,1)}
.mod.wide{max-width:760px}
@keyframes su{from{transform:translateY(18px);opacity:0}}
.mod-h{position:sticky;top:0;background:#fff;padding:16px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;z-index:2}
.mod-h h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
.mod-h .sp{flex:1}
.mod-b{padding:18px}
.mod-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;
  position:sticky;bottom:0;background:#fff}
.mod-f .btn{flex:1}
.xbtn{width:30px;height:30px;border-radius:9px;background:#f0f2f6;display:flex;align-items:center;
  justify-content:center;color:var(--tx2);font-size:17px;line-height:1}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 480px at 50% -10%,#e6eeff,transparent 70%)}
.auth-box{width:100%;max-width:392px}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo .ic{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--pri),var(--pur));
  display:flex;align-items:center;justify-content:center;margin:0 auto 13px;font-size:27px;
  box-shadow:0 8px 26px rgba(47,107,255,.28)}
.auth-logo h1{margin:0 0 5px;font-size:21px;font-weight:800;letter-spacing:-.6px}
.auth-logo p{margin:0;font-size:12.5px;color:var(--tx3)}

/* ---------- misc ---------- */
.upl{border:1.5px dashed var(--line2);border-radius:var(--r);padding:22px 14px;text-align:center;
  cursor:pointer;transition:.14s;background:#fafbfd}
.upl:hover{border-color:var(--pri);background:var(--pri-soft)}
.upl .ic{font-size:26px;margin-bottom:7px;opacity:.7}
.upl .t{font-size:13px;font-weight:700}
.upl .s{font-size:11px;color:var(--tx3);margin-top:3px}
.thumb{width:100%;border-radius:var(--rs);border:1px solid var(--line);display:block}
.thumb.sm{width:64px;height:64px;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:300;background:#171b23;
  color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;
  font-weight:700;box-shadow:0 8px 24px rgba(16,24,40,.25);animation:tin .2s;max-width:88vw;text-align:center}
@keyframes tin{from{transform:translate(-50%,14px);opacity:0}}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--dan)}
.divider{height:1px;background:var(--line);margin:14px 0}
.mono{font-variant-numeric:tabular-nums}
.acct{background:#f7f9fc;border:1px dashed var(--line2);border-radius:var(--rs);padding:12px 14px;
  display:flex;align-items:center;gap:10px}
.acct .t{flex:1;font-size:13.5px;font-weight:700;word-break:break-all}
.sw{position:relative;width:42px;height:24px;flex:0 0 auto;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .tr{position:absolute;inset:0;background:#dfe4ec;border-radius:999px;transition:.16s}
.sw .tr:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;
  border-radius:50%;transition:.16s;box-shadow:var(--sh-s)}
.sw input:checked + .tr{background:var(--pri)}
.sw input:checked + .tr:before{transform:translateX(18px)}
.banner{border-radius:var(--r);padding:12px 14px;font-size:12.5px;line-height:1.55;margin-bottom:12px;border:1px solid}
.banner.i{background:var(--pri-soft);border-color:#cfdcff;color:#1a4bc0}
.banner.w{background:var(--warn-soft);border-color:#ffe0b3;color:#8a5300}
.banner.d{background:var(--dan-soft);border-color:#f7cdc9;color:#9b2018}
.banner.s{background:var(--ok-soft);border-color:#bfe6cf;color:#0b7a44}
.banner b{color:inherit}
.cnt{display:flex;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:var(--rs);overflow:hidden}
.cnt button{width:40px;height:40px;font-size:18px;font-weight:700;color:var(--tx2);background:#f4f6f9}
.cnt button:hover{color:var(--pri)}
.cnt .v{flex:1;text-align:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.hide{display:none !important}
.scroll-x{overflow-x:auto;display:flex;gap:8px;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.ck{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);
  border-radius:var(--rs);background:#fff;margin-bottom:7px;transition:.13s}
.ck.done{background:var(--ok-soft);border-color:#bfe6cf}
.ck .box{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line2);background:#fff;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;
  font-size:13px;color:#fff;font-weight:900;margin-top:1px}
.ck.done .box{background:var(--ok);border-color:var(--ok)}
.ck .tx{flex:1;font-size:13.5px;line-height:1.45;word-break:break-word}
.ck.done .tx{color:var(--ok);text-decoration:line-through;text-decoration-color:rgba(15,157,88,.4)}
.ck .del{color:var(--tx3);font-size:15px;padding:0 3px;line-height:1}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid .ph{position:relative;aspect-ratio:1;border-radius:var(--rs);overflow:hidden;
  border:1px solid var(--line);background:#f4f6f9}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photo-grid .ph .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.photo-grid .add{aspect-ratio:1;border:1.5px dashed var(--line2);border-radius:var(--rs);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--tx3);font-size:11px;font-weight:700;background:#fafbfd}
.photo-grid .add:hover{border-color:var(--pri);color:var(--pri)}
</style>
</head>

function fmtD(s) { const d = parseD(s); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + DOWK[d.getDay()] + ")"; }
function fmtDL(s) { const d = parseD(s); return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + " (" + DOWK[d.getDay()] + ")"; }
function hm2min(t) { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function tsHM(ts) { if (!ts) return null; const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function tsFmt(ts) { if (!ts) return "-"; const d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function tsFmtFull(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
/** 날짜 s 의 HH:MM 시각을 ms 로 */
function atTime(s, hm) { const [h, m] = hm.split(":").map(Number); const d = parseD(s); d.setHours(h, m, 0, 0); return d.getTime(); }
function initial(n) { return (n || "?").trim().slice(-2); }
function uid8() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function monthOf(s) { return s.slice(0, 7); }
function prevMonth(ym) {
  let [y, m] = ym.split("-").map(Number); m--; if (m < 1) { m = 12; y--; }
  return y + "-" + pad(m);
}

function toast(msg, kind) {
  $$(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function compressImage(file, maxW, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, (maxW || 900) / img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let q = quality || 0.72, out = c.toDataURL("image/jpeg", q);
        while (out.length > 700000 && q > 0.3) { q -= 0.12; out = c.toDataURL("image/jpeg", q); }
        res(out);
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ============================ 근무일 / 대상일 ============================ */
function isWorkday(date, holidays) {
  const h = holidays[date];
  if (h && typeof h.work === "boolean") return h.work;
  const w = dow(date);
  return w >= 1 && w <= 5;
}
function holidayName(date, holidays) { const h = holidays[date]; return h && h.name ? h.name : ""; }

/** 지금 보고해야 할 "다음 근무일" — 대상일 08:00 이 지나면 그 다음 근무일로 넘어감 */
function nextReportDate(H, S) {
  const roll = (S && S.reportRollover) || "08:00";
  let d = today();
  for (let i = 0; i < 40; i++) {
    if (isWorkday(d, H) && Date.now() < atTime(d, roll)) return d;
    d = addDays(d, 1);
  }
  return d;
}

/** 출근보고 마감 시각(ms) */
function reportDeadlineTs(date, type, S) {
  if (type === "개직") return atTime(date, S.gaejikDeadline || "03:00");
  return atTime(addDays(date, -1), S.reportDeadline || "22:00");
}

/* ============================================================================
   벌금 규칙 엔진 v2
   ============================================================================ */
function computeDay(date, daily, S, H, user) {
  const out = [];
  if (!isWorkday(date, H)) return out;
  if (user && !gradeInfo(user).fine) return out;        // 후보자 등급은 전면 면제

  const past = date < today();
  const d = daily || {};
  const type = d.type || null;
  const rule = typeRule(S, type);

  /* 1) 출근보고 — 전날 마감까지 다음날 근무유형 선택 */
  if (S.reportForAll || type !== "개직") {
    if (!type) {
      out.push({ kind: "report", amount: S.reportFine, reason: past ? "출근보고 미제출" : "아직 미제출", pending: !past });
    } else {
      const dl = reportDeadlineTs(date, type, S);
      if (d.reportAt && d.reportAt > dl)
        out.push({ kind: "report", amount: S.reportFine, reason: "마감 후 제출 (" + tsFmt(d.reportAt) + ")" });
    }
  }

  /* 2) 출근 — 사진 업로드 시각 기준 지각 / 미출근 */
  if (rule.late) {
    const upAt = d.checkinAt || null;
    if (upAt) {
      const hm = tsHM(upAt);
      const diff = hm2min(hm) - hm2min(rule.start);
      if (diff > 0)
        out.push({ kind: "late", amount: Math.min(diff * rule.perMin, rule.max),
                   reason: hm + " 등록 · 기준 " + rule.start + " 대비 " + diff + "분 초과" });
    } else {
      const cut = atTime(date, S.absentBy || "08:50");
      if (Date.now() > cut)
        out.push({ kind: "absent", amount: S.absentFine,
                   reason: (S.absentBy || "08:50") + " 까지 출근사진 미등록" });
    }
  }

  /* 3) 워킹사진 보고 */
  if (rule.photo) {
    const cnt = photoOkCount(d, date, S);
    const dayEnd = atTime(date, S.photoTo || "23:59") + 59999;
    if (cnt < S.photoMin && (past || Date.now() > dayEnd || cnt > 0))
      out.push({ kind: "photo", amount: S.photoFine,
                 reason: "워킹사진 " + cnt + "/" + S.photoMin + "장 (" + (S.photoFrom || "10:00") + "~" + (S.photoTo || "23:59") + " 인정)",
                 pending: !past });
  }

  /* 4) 일마감 — 당일 13:00~23:59 사이에 저장 1회 이상이면 인정 */
  if (S.closingForAll || type !== "개직") {
    const from = atTime(date, S.closingFrom || "13:00");
    const to = atTime(date, S.closingTo || "23:59") + 59000;
    const saved = d.closingSavedAt || 0;
    const ok = saved >= from && saved <= to;
    if (!ok)
      out.push({ kind: "closing", amount: S.closingFine,
                 reason: past ? "일마감 미실행 (" + (S.closingFrom || "13:00") + "~" + (S.closingTo || "23:59") + ")"
                              : "아직 미실행", pending: !past });
  }
  return out;
}

/** 유형별 출근 규칙 (기준시각 / 분당 / 상한) */
function typeRule(S, type) {
  const base = { late: true, photo: true, start: S.workStart, perMin: S.latePerMin, max: S.lateMax };
  const r = (S.typeRules && S.typeRules[type]) || {};
  return {
    late: r.late !== undefined ? r.late : base.late,
    photo: r.photo !== undefined ? r.photo : base.photo,
    start: r.start || base.start,
    perMin: Number(r.perMin || base.perMin),
    max: Number(r.max || base.max)
  };
}
/** 워킹사진 정규화 — 과거 문자열 배열도 지원 */
function photoList(d) {
  return ((d && d.photos) || []).map(x => (typeof x === "string" ? { u: x, at: null } : x)).filter(x => x && x.u);
}
/** 인정 시간대(기본 10:00~23:59) 안에 올린 사진 수 */
function photoOkCount(d, date, S) {
  const from = atTime(date, S.photoFrom || "10:00");
  const to = atTime(date, S.photoTo || "23:59") + 59999;
  return photoList(d).filter(x => x.at == null || (x.at >= from && x.at <= to)).length;
}

/** 이 사람의 벌금 집계 시작일 — 가입 시점 이후부터만 */
function joinStart(u, S) {
  if (!u || !u.joinedAt) return "";
  const jd = dstr(new Date(u.joinedAt));
  // 그날 출근 등록창(기본 05:00)이 열리기 전에 가입했다면 당일부터, 아니면 다음날부터
  return u.joinedAt <= atTime(jd, (S && S.checkinOpen) || "05:00") ? jd : addDays(jd, 1);
}

function fineId(uid, date, kind) { return uid + "__" + date + "__" + kind; }
function dayId(uid, date) { return uid + "__" + date; }

/* ============================================================================
   데이터 레이어
   ============================================================================ */
const TABLES = {
  users:    { table: "profiles", json: false },
  daily:    { table: "daily",    json: true },
  fines:    { table: "fines",    json: true },
  glog:     { table: "glog",     json: true },
  holidays: { table: "holidays", json: true },
  settings: { table: "settings", json: true }
};

function rowToUser(r) {
  return {
    id: r.uid, uid: r.uid, email: r.email, name: r.name,
    birth: r.birth || "", grade: r.grade || "후보자",
    role: r.role, approved: !!r.approved, disabled: !!r.disabled,
    gaejik: Number(r.gaejik || 0), bdayYear: Number(r.bday_year || 0),
    checklist: Array.isArray(r.checklist) ? r.checklist : [],
    tlMembers: Array.isArray(r.tl_members) ? r.tl_members : [],
    lastGrant: r.last_grant || "",
    joinedAt: r.joined_at ? new Date(r.joined_at).getTime() : 0
  };
}
function userToRow(d) {
  const o = {};
  if ("uid" in d) o.uid = d.uid;
  if ("email" in d) o.email = d.email;
  if ("name" in d) o.name = d.name;
  if ("birth" in d) o.birth = d.birth || null;
  if ("grade" in d) o.grade = d.grade;
  if ("approved" in d) o.approved = !!d.approved;
  if ("disabled" in d) o.disabled = !!d.disabled;
  if ("gaejik" in d) o.gaejik = Number(d.gaejik || 0);
  if ("bdayYear" in d) o.bday_year = Number(d.bdayYear || 0);
  if ("checklist" in d) o.checklist = d.checklist || [];
  if ("tlMembers" in d) o.tl_members = d.tlMembers || [];
  if ("lastGrant" in d) o.last_grant = d.lastGrant || null;
  if ("joinedAt" in d) o.joined_at = new Date(d.joinedAt).toISOString();
  return o;
}
function rowToDoc(r) { return Object.assign({}, r.data || {}, { id: r.id }); }

const DB = {
  mode: "demo", ready: false, sb: null,
  cache: { users: {}, daily: {}, fines: {}, glog: {}, holidays: {}, settings: {} },
  subs: [],
  onChange(fn) { this.subs.push(fn); },
  emit() { this.subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }
};

function savedCfg() {
  if (SUPABASE_CONFIG && SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey) return SUPABASE_CONFIG;
  try { const s = localStorage.getItem("teamfine_sb"); if (s) return JSON.parse(s); } catch (e) { }
  return null;
}

const SB_CDNS = [
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm",
  "https://esm.sh/@supabase/supabase-js@2"
];
async function loadSupabaseLib() {
  if (typeof supabaseLib !== "undefined" && supabaseLib.createClient) return supabaseLib;
  let last;
  for (const url of SB_CDNS) {
    try { const m = await import(url); if (m && m.createClient) return m; }
    catch (e) { last = e; }
  }
  throw new Error("Supabase 라이브러리를 불러오지 못했습니다. " + ((last && last.message) || ""));
}
async function initSupabase(cfg) {
  const m = await loadSupabaseLib();
  DB.sb = m.createClient(cfg.url, cfg.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });
  DB.mode = "sb";
  return DB.sb;
}

DB.loadAll = async function () {
  const jobs = Object.keys(TABLES).map(async col => {
    const T = TABLES[col];
    const { data, error } = await this.sb.from(T.table).select("*");
    if (error) { console.warn("load " + col, error.message); return; }
    const o = {};
    (data || []).forEach(r => { const d = T.json ? rowToDoc(r) : rowToUser(r); o[d.id] = d; });
    this.cache[col] = o;
  });
  await Promise.all(jobs);
  this.ready = true;
  this.emit();
};

DB.subscribeRT = function () {
  const ch = this.sb.channel("teamfine");
  Object.keys(TABLES).forEach(col => {
    const T = TABLES[col];
    ch.on("postgres_changes", { event: "*", schema: "public", table: T.table }, payload => {
      try {
        if (payload.eventType === "DELETE") {
          const oid = payload.old && (T.json ? payload.old.id : payload.old.uid);
          if (oid) delete this.cache[col][oid];
        } else {
          const d = T.json ? rowToDoc(payload.new) : rowToUser(payload.new);
          this.cache[col][d.id] = d;
        }
        this.emit();
      } catch (e) { console.error(e); }
    });
  });
  ch.subscribe();
};

/** users 는 패치 필드만 update, 없으면 insert (권한 필드 오염 방지) */
DB.set = async function (col, id, data) {
  if (this.mode !== "sb") {
    this.cache[col][id] = Object.assign({}, this.cache[col][id] || {}, data, { id });
    this.emit(); return;
  }
  const T = TABLES[col];
  const prev = this.cache[col][id] || {};
  const merged = Object.assign({}, prev, data, { id });
  this.cache[col][id] = merged;
  this.emit();

  let error = null;
  if (T.json) {
    const body = Object.assign({}, merged); delete body.id;
    const row = { id, uid: body.uid || null, date: body.date || null, data: body };
    ({ error } = await this.sb.from(T.table).upsert(row, { onConflict: "id" }));
  } else {
    const patch = userToRow(data);
    delete patch.uid;
    if (Object.keys(patch).length) {
      const r = await this.sb.from(T.table).update(patch).eq("uid", id).select("uid");
      error = r.error;
      if (!error && (!r.data || r.data.length === 0)) {
        const ins = Object.assign(userToRow(merged), { uid: id });
        ({ error } = await this.sb.from(T.table).insert(ins));
      }
    }
  }
  if (error) {
    if (prev.id) this.cache[col][id] = prev; else delete this.cache[col][id];
    this.emit();
    throw new Error(error.message);
  }
};

DB.del = async function (col, id) {
  if (this.mode !== "sb") { delete this.cache[col][id]; this.emit(); return; }
  const T = TABLES[col];
  const { error } = await this.sb.from(T.table).delete().eq(T.json ? "id" : "uid", id);
  if (error) throw new Error(error.message);
  delete this.cache[col][id]; this.emit();
};
DB.add = async function (col, data) {
  const id = uid8();
  await this.set(col, id, Object.assign({}, data, { id }));
  return id;
};
DB.get = function (col, id) { return this.cache[col][id] || null; };
DB.all = function (col) { return Object.values(this.cache[col]); };

DB.uploadImage = async function (dataUrl, folder) {
  if (this.mode !== "sb") return dataUrl;
  try {
    const bin = atob(dataUrl.split(",")[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const path = (Auth.user ? Auth.user.uid : "anon") + "/" + (folder || "img") + "-" + uid8() + ".jpg";
    const { error } = await this.sb.storage.from("proofs")
      .upload(path, new Blob([arr], { type: "image/jpeg" }), { contentType: "image/jpeg" });
    if (error) { console.warn("upload", error.message); return dataUrl; }
    const { data } = await this.sb.storage.from("proofs").createSignedUrl(path, 60 * 60 * 24 * 365);
    return (data && data.signedUrl) || dataUrl;
  } catch (e) { console.warn(e); return dataUrl; }
};

/* ============================ 인증 ============================ */
let pendingProfile = null;
function withTimeout(p, ms, label) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(
    () => rej(new Error((label || "요청") + "이 응답하지 않습니다. 연결을 확인해주세요.")), ms || 15000))]);
}

const Auth = {
  user: null, profile: null,
  async signup(email, pw, name, birth) {
    if (DB.mode === "sb") {
      const { data, error } = await withTimeout(DB.sb.auth.signUp({ email, password: pw }), 15000, "회원가입");
      if (error) throw new Error(error.message);
      pendingProfile = { name, birth };
      if (!data.session) throw new Error("__CONFIRM_EMAIL__");
      const u = data.user;
      Auth.user = { uid: u.id, email: u.email };
      await DB.set("users", u.id, { uid: u.id, email: u.email, name, birth, joinedAt: Date.now() });
      await DB.loadAll();
      pendingProfile = null;
      return Auth.user;
    }
    const id = "u_" + uid8();
    const first = DB.all("users").length === 0;
    await DB.set("users", id, {
      uid: id, email, name, birth, pw, grade: first ? "SM" : "후보자",
      approved: first, gaejik: 0, joinedAt: Date.now(), bdayYear: 0, checklist: [], tlMembers: []
    });
    this.user = { uid: id, email };
    return this.user;
  },
  async login(email, pw) {
    if (DB.mode === "sb") {
      const { data, error } = await withTimeout(DB.sb.auth.signInWithPassword({ email, password: pw }), 15000, "로그인");
      if (error) throw new Error(error.message);
      return data.user;
    }
    const u = DB.all("users").find(x => x.email === email && x.pw === pw);
    if (!u) throw new Error("이메일 또는 비밀번호가 올바르지 않습니다.");
    this.user = { uid: u.uid, email }; DB.emit();
    return this.user;
  },
  async resetPw(email) {
    if (DB.mode !== "sb") throw new Error("데모 모드에서는 지원되지 않습니다.");
    const { error } = await DB.sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
    if (error) throw new Error(error.message);
  },
  async logout() {
    if (DB.mode === "sb") { try { await DB.sb.auth.signOut(); } catch (e) { } }
    this.user = null; this.profile = null; App.view = "home"; render();
  },
  isAdmin() { return !!(this.profile && gradeInfo(this.profile).admin); },
  isTL() { return !!(this.profile && gradeInfo(this.profile).tl); },
  /** TL/SM 이 해당 팀원의 상세(일마감·직출사유)를 볼 수 있는가 */
  canSee(uid) {
    if (!this.profile) return false;
    if (this.profile.uid === uid) return true;
    if (this.isAdmin()) return true;
    if (gradeInfo(this.profile).tl) return (this.profile.tlMembers || []).indexOf(uid) >= 0;
    return false;
  }
};

/* ============================ 파생 데이터 ============================ */
function SET() { return Object.assign({}, DEFAULT_SETTINGS, DB.get("settings", "global") || {}); }
function HOLIDAYS() { return DB.cache.holidays; }
function USERS() { return DB.all("users").sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko")); }
function ACTIVE_USERS() { return USERS().filter(u => u.approved && !u.disabled); }

function collectFines(opt) {
  opt = opt || {};
  const S = SET(), H = HOLIDAYS();
  const users = opt.uid ? USERS().filter(u => u.uid === opt.uid) : ACTIVE_USERS();
  const tdy = today();
  let from = opt.from || S.startDate || "";
  let to = opt.to || tdy;
  if (to > tdy) to = tdy;
  const list = [];

  users.forEach(u => {
    let start = from || addDays(tdy, -60);
    const js = joinStart(u, S);
    if (js && js > start) start = js;        // 가입 이전 기간은 절대 집계하지 않음
    if (start > to) { return; }              // 가입 전 구간만 요청된 경우 → 벌금 없음
    let d = start;
    let guard = 0;
    while (d <= to && guard++ < 800) {
      const daily = DB.get("daily", dayId(u.uid, d));
      computeDay(d, daily, S, H, u).forEach(f => {
        const id = fineId(u.uid, d, f.kind);
        const ov = DB.get("fines", id) || {};
        if (ov.deleted) return;
        list.push({
          id, uid: u.uid, name: u.name, date: d, kind: f.kind,
          amount: ov.amount != null ? ov.amount : f.amount,
          reason: ov.memo || f.reason,
          pending: !!f.pending, waived: !!ov.waived,
          status: ov.status || "unpaid",
          proof: ov.proof || null, proofAt: ov.proofAt || null,
          confirmedAt: ov.confirmedAt || null, confirmedBy: ov.confirmedBy || null,
          batch: ov.batch || null, auto: true
        });
      });
      d = addDays(d, 1);
    }
  });

  DB.all("fines").filter(f => f.manual && !f.deleted).forEach(f => {
    if (opt.uid && f.uid !== opt.uid) return;
    if (f.date < (from || "0000") || f.date > to) return;
    const u = DB.get("users", f.uid);
    list.push({
      id: f.id, uid: f.uid, name: (u && u.name) || "?", date: f.date,
      kind: f.kind || "etc", amount: f.amount || 0, reason: f.memo || "관리자 추가",
      pending: false, waived: !!f.waived, status: f.status || "unpaid",
      proof: f.proof || null, proofAt: f.proofAt || null,
      confirmedAt: f.confirmedAt || null, confirmedBy: f.confirmedBy || null,
      batch: f.batch || null, auto: false
    });
  });

  list.sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name, "ko"));
  return list;
}
function sumFines(list, filter) {
  return list.filter(f => !f.waived && !f.pending).filter(filter || (() => true))
    .reduce((s, f) => s + (f.amount || 0), 0);

function cleanErr(e) {
  const m = String((e && e.message) || e);
  if (/already registered|already been registered|User already/i.test(m)) return "이미 가입된 이메일입니다.";
  if (/Invalid login credentials/i.test(m)) return "이메일 또는 비밀번호가 올바르지 않습니다.";
  if (/Email not confirmed/i.test(m)) return "이메일 인증을 먼저 완료해주세요.";
  if (/Password should be at least/i.test(m)) return "비밀번호는 6자 이상이어야 합니다.";
  if (/Unable to validate email|invalid format/i.test(m)) return "이메일 형식이 올바르지 않습니다.";
  if (/row-level security|permission denied|권한이 없습니다/i.test(m)) return "권한이 없습니다. 관리자만 가능한 작업입니다.";
  if (/relation .* does not exist|schema cache|column .* does not exist/i.test(m))
    return "데이터베이스 설정이 최신이 아닙니다. 관리자에게 문의해주세요.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "네트워크 연결을 확인해주세요.";
  return m;
}

      (o.onOk ? '<button class="btn pri" id="mO">' + esc(o.okText || "저장") + "</button>" : "") +
      "</div>") + "</div>";
  document.body.appendChild(el);
  if (!o.noClose) el.onclick = e => { if (e.target === el) closeModal(); };
  const x = $("#mX"); if (x) x.onclick = closeModal;
  const c = $("#mC"); if (c) c.onclick = closeModal;

  if (o.after) o.after();

      (left < 0
        ? "⚠️ <b>" + fmtD(rDate) + " 출근보고 마감이 지났습니다.</b> 지금 제출해도 " + won(S.reportFine) + " 벌금 대상입니다."
        : "🗓 <b>" + fmtD(rDate) + " 출근보고</b>가 아직입니다. " + tsFmtFull(dl) + " 까지 선택해주세요." +
          " (남은 시간 " + Math.floor(left / 3600000) + "시간 " + Math.floor(left % 3600000 / 60000) + "분)") +
      '<div style="margin-top:9px"><button class="btn pri sm" data-nav="report">지금 선택하기</button></div></div>';
  }

  /* 오늘 체크리스트 */
  if (wToday) {
    const rule = typeRule(S, dToday.type);
    const items = [];
    if (rule.late) {
      const at = dToday.checkinAt;
      const hm = tsHM(at);
      const diff = at ? hm2min(hm) - hm2min(rule.start) : null;
      const absentCut = atTime(tdy, S.absentBy);
      items.push({
        t: "출근 사진", ic: "📸",
        ok: at ? diff <= 0 : null,
        bad: at ? diff > 0 : Date.now() > absentCut,
        d: at ? (hm + " 등록" + (diff > 0 ? " · 기준 " + rule.start + " 초과 " + diff + "분 · " + won(Math.min(diff * rule.perMin, rule.max)) : " · 정상"))
              : (Date.now() > absentCut ? "미출근 " + won(S.absentFine) + " 대상" : rule.start + " 까지 사진을 올려주세요"),
        act: at ? null : "checkin"
      });
    }
    if (rule.photo) {
      const c = photoOkCount(dToday, tdy, S);
      items.push({ t: "워킹사진 " + c + "/" + S.photoMin, ic: "🖼",
        ok: c >= S.photoMin,
        d: c >= S.photoMin ? "완료" : (S.photoFrom || "10:00") + "~" + (S.photoTo || "23:59") + " 인정 · 부족시 " + won(S.photoFine),
        act: c >= S.photoMin ? null : "report" });
    }
    if (S.closingForAll || dToday.type !== "개직") {
      const from = atTime(tdy, S.closingFrom), to = atTime(tdy, S.closingTo) + 59000;
      const saved = dToday.closingSavedAt || 0;
      const ok = saved >= from && saved <= to;
      items.push({ t: "일마감", ic: "📋", ok,
        d: ok ? "완료 · " + tsFmt(saved) : S.closingFrom + "~" + S.closingTo + " 사이 저장 · 미실행시 " + won(S.closingFine),
        act: ok ? null : "report" });
    }
    h += '<div class="card pad0"><div class="card-h" style="padding:16px 16px 0;margin-bottom:8px"><h3>오늘 할 일</h3></div>' +
      items.map(it =>
        '<div class="row">' +
        '<span style="font-size:19px">' + it.ic + "</span>" +
        '<div class="sp"><div class="nm">' + it.t + '</div><div class="ds">' + esc(it.d) + "</div></div>" +
        (it.ok === true ? '<span class="bdg g">완료</span>'
          : it.bad ? '<span class="bdg r">벌금</span>'
          : it.act ? '<button class="btn sm pri" data-nav="' + it.act + '">하기</button>'
          : '<span class="bdg n">대기</span>') +
        "</div>").join("") + "</div>";
  }

  h += '<div class="grid g2">' +
    '<div class="stat ' + (mUnpaid ? "acc-r" : "acc-g") + '"><div class="lb">미납 벌금</div><div class="vl">' + won(mUnpaid) + "</div>" +
    '<div class="sub">' + mine.filter(f => !f.waived && !f.pending && f.status === "unpaid").length + "건</div></div>" +
    '<div class="stat"><div class="lb">이번달 벌금</div><div class="vl">' + won(sumFines(thisMonth)) + "</div>" +
    '<div class="sub">' + thisMonth.filter(f => !f.waived && !f.pending).length + "건</div></div></div>";

  if (mUnpaid) h += '<button class="btn pri full" id="payNow" style="margin-bottom:12px">💸 지금 납부하고 캡쳐 올리기</button>';

  if (admin) {
    const all = collectFines({});
    const pendingProof = all.filter(f => f.status === "submitted").length;
    const pendingUsers = USERS().filter(u => !u.approved && !u.disabled).length;
    const noCheckin = ACTIVE_USERS().filter(u => {
      const d = DB.get("daily", dayId(u.uid, tdy)) || {};
      const r = S.typeRules[d.type] || { late: true };
      return wToday && r.late && gradeInfo(u).fine && !d.checkinAt;
    }).length;
    h += '<div class="sec-t">관리자 현황</div><div class="grid g2">' +
      '<div class="stat acc-b"><div class="lb">팀 전체 미납</div><div class="vl" style="font-size:19px">' +
      won(sumFines(all, f => f.status !== "paid")) + "</div></div>" +
      '<div class="stat ' + (pendingProof ? "acc-g" : "") + '"><div class="lb">납부 확인 대기</div><div class="vl">' + pendingProof + "건</div></div>" +
      '<div class="stat ' + (noCheckin ? "acc-r" : "") + '"><div class="lb">오늘 미출근</div><div class="vl">' + noCheckin + "명</div></div>" +
      '<div class="stat ' + (pendingUsers ? "acc-p" : "") + '"><div class="lb">가입 승인 대기</div><div class="vl">' + pendingUsers + "명</div></div></div>" +
      '<div class="btn-row" style="margin-top:4px">' +
      '<button class="btn pri" data-nav="checkin">출근 현황</button>' +
      '<button class="btn" data-nav="fines">벌금 관리</button>' +
      (pendingUsers ? '<button class="btn" data-nav="admin">가입 승인 ' + pendingUsers + "</button>" : "") + "</div>";
  }

  const recent = mine.filter(f => !f.pending).slice(0, 6);
  h += '<div class="sec-t">내 최근 벌금</div><div class="card pad0">' +
    (recent.length ? recent.map(fineRow).join("") : '<div class="empty">아직 벌금 내역이 없습니다 👏</div>') + "</div>";
  return h;
}

function fineRow(f) {
  const K = KINDS[f.kind] || KINDS.etc;
  return '<div class="row" data-open-fine="' + f.id + '" style="cursor:pointer">' +
    '<span style="font-size:17px">' + K.icon + "</span>" +
    '<div class="sp"><div class="nm">' + K.label +
    (f.name && Auth.isAdmin() ? ' <span style="color:var(--tx3);font-weight:600">· ' + esc(f.name) + "</span>" : "") +
    '</div><div class="ds">' + fmtD(f.date) + " · " + esc(f.reason) + "</div></div>" +
    '<div style="text-align:right"><div class="nm mono" style="' + (f.waived ? "text-decoration:line-through;color:var(--tx3)" : "") + '">' + won(f.amount) + "</div>" +
    '<div style="margin-top:3px">' + fineBadge(f) + "</div></div></div>";
}
function fineBadge(f) {
  if (f.waived) return '<span class="bdg c">포인트납입</span>';
  if (f.pending) return '<span class="bdg y">진행중</span>';
  if (f.status === "paid") return '<span class="bdg g">납부완료</span>';
  if (f.status === "submitted") return '<span class="bdg c">확인대기</span>';
  return '<span class="bdg r">미납</span>';
}

/* ============================================================================
   출근 — 사진 업로드로 출근 체크 · 전 회원 공개
   ============================================================================ */
function viewCheckin() {
  const p = Auth.profile, S = SET(), H = HOLIDAYS();
  const date = App.checkDate, tdy = today();
  const admin = Auth.isAdmin();
  const wd = isWorkday(date, H), hn = holidayName(date, H);
  const me = DB.get("daily", dayId(p.uid, date)) || {};
  const isToday = date === tdy;
  const myRule = typeRule(S, me.type);

  let h = "";

  /* 날짜 이동 */
  h += '<div class="card"><div class="btn-row" style="align-items:center">' +
    '<button class="btn sm" id="ckPrev">‹</button>' +
    '<input class="inp" type="date" id="ckDate" value="' + date + '" style="flex:1;min-width:140px">' +
    '<button class="btn sm" id="ckNext" ' + (date >= tdy ? "disabled" : "") + '>›</button>' +
    '<button class="btn sm" id="ckToday">오늘</button></div>' +
    '<div class="btn-row" style="margin-top:11px;align-items:center">' +
    '<span class="bdg ' + (wd ? "b" : "n") + '">' + fmtDL(date) + " · " + (wd ? "근무일" : "휴무일") + "</span>" +
    (hn ? '<span class="bdg y">' + esc(hn) + "</span>" : "") +
    '<div style="flex:1"></div>' +
    (admin ? '<button class="btn sm" id="ckHol">' + (wd ? "휴무일로" : "근무일로") + "</button>" : "") + "</div>" +
    '<div class="hint" style="margin-top:8px">등록 가능 ' + (S.checkinOpen || "05:00") + " 부터 · " +
    Object.keys(TYPES).filter(t => typeRule(S, t).late).map(t => {
      const r = typeRule(S, t);
      return t + " " + r.start + "(분당 " + (r.perMin / 10000 >= 1 ? (r.perMin / 10000) + "만" : (r.perMin / 1000) + "천") + "원·최대 " + (r.max / 10000) + "만)";
    }).join(" · ") + " · " + S.absentBy + " 미등록시 미출근 " + won(S.absentFine) + "</div></div>";

  /* 내 출근 등록 */
  if (wd && myRule.late) {
    const at = me.checkinAt, hm = tsHM(at);
    const diff = at ? hm2min(hm) - hm2min(myRule.start) : null;
    const fine = diff > 0 ? Math.min(diff * myRule.perMin, myRule.max) : 0;
    const overCut = Date.now() > atTime(date, S.absentBy);
    const openTs = atTime(date, S.checkinOpen || "05:00");
    const beforeOpen = isToday && Date.now() < openTs;

    h += '<div class="card"><div class="card-h"><h3>📸 내 출근</h3><div class="sp"></div>' +
      (at ? (diff > 0 ? '<span class="bdg r">' + diff + "분 지각</span>" : '<span class="bdg g">정상 출근</span>')
          : (overCut ? '<span class="bdg r">미출근</span>' : '<span class="bdg y">미등록</span>')) + "</div>";

    if (at) {
      h += '<div class="banner ' + (diff > 0 ? "d" : "s") + '">' +
        "등록 시각 <b>" + hm + "</b> · " + (me.type || "출근") + " 기준 <b>" + myRule.start + "</b>" +
        (diff > 0 ? " 대비 <b>" + diff + "분</b> 초과 → 벌금 <b>" + won(fine) + "</b>"
                  : " 내 정상 출근입니다 👍") + "</div>";
      if (me.checkinPhoto)
        h += '<img src="' + me.checkinPhoto + '" class="thumb" style="margin-bottom:10px" data-img="' + me.checkinPhoto + '" data-imgt="내 출근 · ' + hm + '">';
      if (isToday) h += '<button class="btn full sm" id="ckReUp">사진 다시 올리기</button>';
    } else if (isToday) {
      h += (beforeOpen
        ? '<div class="banner w">🕔 출근 등록은 <b>' + (S.checkinOpen || "05:00") + '</b> 부터 가능합니다.</div>'
        : (overCut ? '<div class="banner d">⚠️ ' + S.absentBy + " 이 지났습니다. 지금 등록해도 <b>미출근 " + won(S.absentFine) + "</b> 대상입니다.</div>" : "")) +
        '<div class="upl" id="ckUp" style="' + (beforeOpen ? "opacity:.5;pointer-events:none" : "") + '"><div class="ic">📷</div>' +
        '<div class="t">' + (me.type === "병원근무" ? "병원 도착 사진 올리기" : me.type === "직출" ? "상담처 도착 사진 올리기" : "회사 도착 사진 올리기") + "</div>" +
        '<div class="s">올린 시각이 출근 시각으로 기록됩니다 · 기준 ' + myRule.start + "</div></div>";
    } else {
      h += '<div class="banner d">이 날은 출근 사진이 등록되지 않았습니다.</div>';
      if (admin) h += '<div class="hint">관리자는 아래 목록에서 시각을 직접 입력할 수 있습니다.</div>';
    }
    h += '<input type="file" accept="image/*" capture="environment" id="ckFile" class="hide"></div>';
  }

  /* 전체 출근 현황 — 모든 회원 공개 */
  const users = ACTIVE_USERS();
  const rows = users.map(u => {
    const d = DB.get("daily", dayId(u.uid, date)) || {};
    const r = typeRule(S, d.type);
    const at = d.checkinAt, hm = tsHM(at);
    const diff = at ? hm2min(hm) - hm2min(r.start) : null;
    return { u, d, r, at, hm, diff };
  }).sort((a, b) => (a.at || 9e15) - (b.at || 9e15));

  h += '<div class="sec-t">' + fmtD(date) + " 출근 현황 (" + rows.filter(r => r.at).length + "/" + users.length + ")</div>" +
    '<div class="card pad0">' +
    (rows.length ? rows.map(r => {
      const late = r.diff > 0;
      const exempt = !r.r.late || !gradeInfo(r.u).fine;
      const extra = [];
      if (r.d.type === "병원근무" && r.d.hospital) extra.push("🏥 " + esc(r.d.hospital));
      if (r.d.type === "직출" && r.d.reason) extra.push("🚗 " + esc(r.d.reason));
      return '<div style="border-bottom:1px solid var(--line)"><div class="row" style="border-bottom:none">' +
        (r.d.checkinPhoto
          ? '<img src="' + r.d.checkinPhoto + '" class="thumb sm" style="cursor:pointer" data-img="' + r.d.checkinPhoto + '" data-imgt="' + esc(r.u.name) + ' 출근 · ' + (r.hm || "") + '">'
          : '<div class="thumb sm" style="display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:20px">—</div>') +
        '<div class="sp"><div class="nm">' + esc(r.u.name) +
        (r.d.type ? ' <span class="bdg ' + TYPES[r.d.type].color + '">' + r.d.type + "</span>" : "") + "</div>" +
        '<div class="ds">' + (r.at ? "등록 " + r.hm + " · 기준 " + r.r.start + (late ? " · " + r.diff + "분 초과" : " · 정상") : "미등록") + "</div></div>" +
        '<div style="text-align:right">' +
        (exempt ? '<span class="bdg n">미적용</span>'
          : r.at ? (late ? '<span class="bdg r">' + won(Math.min(r.diff * r.r.perMin, r.r.max)) + "</span>" : '<span class="bdg g">정상</span>')
          : (Date.now() > atTime(date, S.absentBy) ? '<span class="bdg r">미출근</span>' : '<span class="bdg y">대기</span>')) +
        (admin ? '<div style="margin-top:5px"><input class="inp" type="time" style="padding:4px 6px;font-size:11.5px;width:98px" value="' +
          (r.hm || "") + '" data-ct="' + r.u.uid + '"></div>' : "") +
        "</div></div>" +
        (extra.length || r.d.reasonPhoto
          ? '<div style="padding:0 14px 12px 14px">' +
            (extra.length ? '<div class="banner i" style="margin:0 0 8px;font-size:12px">' + extra.join("<br>") + "</div>" : "") +
            (r.d.reasonPhoto ? '<img src="' + r.d.reasonPhoto + '" class="thumb" style="max-width:220px;cursor:pointer" data-img="' + r.d.reasonPhoto + '" data-imgt="' + esc(r.u.name) + ' 직출 증빙">' : "") +
            "</div>" : "") +
        "</div>";
    }).join("") : '<div class="empty">승인된 팀원이 없습니다</div>') + "</div>";

  if (admin) h += '<div class="hint" style="margin-top:8px">관리자는 시각 칸을 직접 고쳐 저장할 수 있습니다. 비우면 미등록 처리됩니다.</div>';
  return h;
}

function bindCheckin() {
  const p = Auth.profile, S = SET();
  $("#ckPrev").onclick = () => { App.checkDate = addDays(App.checkDate, -1); render(); };
  const nx = $("#ckNext");
  if (nx) nx.onclick = () => { if (App.checkDate < today()) { App.checkDate = addDays(App.checkDate, 1); render(); } };
  $("#ckToday").onclick = () => { App.checkDate = today(); render(); };
  $("#ckDate").onchange = e => { App.checkDate = e.target.value > today() ? today() : e.target.value; render(); };

  const hol = $("#ckHol");
  if (hol) hol.onclick = async () => {
    const d = App.checkDate, H = HOLIDAYS(), cur = isWorkday(d, H), ex = H[d] || {};
    await DB.set("holidays", d, { date: d, name: ex.name || (dow(d) === 0 || dow(d) === 6 ? "주말 근무" : "공휴일"), work: !cur });
    toast(!cur ? "근무일로 지정됨" : "휴무일로 지정됨", "ok");
  };

  const file = $("#ckFile");
  const doUpload = () => file && file.click();
  const up = $("#ckUp"); if (up) up.onclick = doUpload;
  const re = $("#ckReUp"); if (re) re.onclick = doUpload;
  if (file) file.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const openTs = atTime(today(), S.checkinOpen || "05:00");
    if (Date.now() < openTs) { e.target.value = ""; return toast("출근 등록은 " + (S.checkinOpen || "05:00") + " 부터 가능합니다", "err"); }
    try {
      toast("사진 처리 중…");
      const raw = await compressImage(f, 900, .72);
      const url = await DB.uploadImage(raw, "checkin");
      const now = Date.now();
      await DB.set("daily", dayId(p.uid, today()), {
        uid: p.uid, date: today(), checkinPhoto: url, checkinAt: now, updatedAt: now
      });
      const myR = typeRule(S, (DB.get("daily", dayId(p.uid, today())) || {}).type);
      const diff = hm2min(tsHM(now)) - hm2min(myR.start);
      if (diff > 0) {
        const amt = Math.min(diff * myR.perMin, myR.max);
        toast("기준 " + myR.start + " 초과 " + diff + "분 · " + won(amt), "err");
        App.payShown = false;
        setTimeout(() => { const l = unpaidOf(p.uid); if (l.length) openPayModal(l, true); }, 700);
      } else toast("정상 출근 등록 완료 👍", "ok");
    } catch (er) { toast(cleanErr(er), "err"); }
  };

  $$("[data-ct]").forEach(el => el.onchange = async () => {
    const uid = el.dataset.ct, date = App.checkDate;
    let ts = null;
    if (el.value) { const [hh, mm] = el.value.split(":").map(Number); const d = parseD(date); d.setHours(hh, mm, 0, 0); ts = d.getTime(); }
    await DB.set("daily", dayId(uid, date), { uid, date, checkinAt: ts, checkinBy: Auth.profile.name, updatedAt: Date.now() });
    toast("저장됨", "ok");
  });
}

/* ============================================================================
   보고 — 출근보고 · 워킹사진 · 일마감 체크리스트
   ============================================================================ */
let ckItems = null;   // 일마감 체크리스트 임시 상태

function todayItems(p, dToday) {
  if (ckItems) return ckItems;
  if (Array.isArray(dToday.closingItems) && dToday.closingItems.length)
    ckItems = dToday.closingItems.map(x => ({ t: x.t, done: !!x.done }));
  else
    ckItems = (p.checklist || []).map(t => ({ t: typeof t === "string" ? t : (t.t || ""), done: false }));
  return ckItems;
}

function viewReport() {
  const p = Auth.profile, S = SET(), H = HOLIDAYS(), tdy = today();
  const rDate = nextReportDate(H, S);
  const d = DB.get("daily", dayId(p.uid, rDate)) || {};
  const dT = DB.get("daily", dayId(p.uid, tdy)) || {};
  const dl = reportDeadlineTs(rDate, "출근", S);
  const dlG = reportDeadlineTs(rDate, "개직", S);
  const over = Date.now() > dl;

  let h = '<div class="sec-t">출근보고 · 다음 근무일</div>';
  h += '<div class="card">' +
    '<div class="banner ' + (over ? "d" : "i") + '">' +
    "<b>" + fmtDL(rDate) + "</b> 근무 유형을 선택하세요." +
    (holidayName(rDate, H) ? " <b>(" + esc(holidayName(rDate, H)) + " 근무일)</b>" : "") +
    "<br>일반 마감 " + tsFmtFull(dl) + " · 개직 마감 " + tsFmtFull(dlG) +
    (over ? "<br>⚠️ 마감이 지나 지금 제출하면 " + won(S.reportFine) + " 벌금 대상입니다." : "") +
    '<br><span style="opacity:.75">' + fmtD(rDate) + " " + S.reportRollover + " 이 지나면 그 다음 근무일로 넘어갑니다.</span></div>";

  h += '<div class="tpick">' + Object.keys(TYPES).map(t => {
    const info = TYPES[t];
    const disabled = (t === "개직" && Number(p.gaejik || 0) < 1 && d.type !== "개직");
    return '<button data-type="' + t + '" class="' + (d.type === t ? "on" : "") + '"' + (disabled ? " disabled" : "") + ">" +
      '<div class="tt">' + info.icon + " " + t + "</div>" +
      '<div class="td">' + info.desc + (t === "개직" ? " · 잔여 " + Number(p.gaejik || 0) + "개" : "") + "</div></button>";
  }).join("") + "</div>";

  h += '<div class="fld ' + (d.type === "병원근무" ? "" : "hide") + '" id="hospWrap" style="margin-top:13px">' +
    '<label>병원명 (필수)</label>' +
    '<input class="inp" id="rHosp" placeholder="예: OO정형외과 / OO병원 3층" value="' + esc(d.hospital || "") + '">' +
    '<div class="hint">기준 출근 시각은 ' + typeRule(S, "병원근무").start + " 입니다.</div></div>";

  h += '<div class="' + (d.type === "직출" ? "" : "hide") + '" id="reasonWrap" style="margin-top:13px">' +
    '<div class="fld"><label>직출 사유 (필수)</label>' +
    '<textarea class="inp" id="rReason" placeholder="예) 고객과의 일정 잡는 통화목록 / 연락 사진 첨부&#10;OO고객 10시 방문상담 · 어제 21시 통화 완료">' + esc(d.reason || "") + "</textarea></div>" +
    '<div class="fld"><label>증빙 이미지 (통화목록 · 연락 캡쳐)</label>' +
    (d.reasonPhoto ? '<img src="' + d.reasonPhoto + '" class="thumb" style="margin-bottom:8px" data-img="' + d.reasonPhoto + '" data-imgt="직출 증빙">' : "") +
    '<div class="upl" id="rzUp"><div class="ic">📎</div><div class="t">' + (d.reasonPhoto ? "이미지 다시 올리기" : "이미지 올리기") + "</div>" +
    '<div class="s">통화목록 또는 고객 연락 캡쳐를 첨부해주세요</div></div>' +
    '<input type="file" accept="image/*" id="rzFile" class="hide"></div></div>';
  h += '<button class="btn pri full" id="rSave" style="margin-top:14px">' + (d.type ? "보고 수정" : "보고 제출") + "</button>";
  if (d.type) h += '<div class="hint" style="text-align:center;margin-top:9px">✅ ' + d.type +
    " 로 제출됨 · " + tsFmtFull(d.reportAt) + (d.gaejikUsed ? " · 개직 1개 차감" : "") +
    "<br>수정하면 <b>수정한 시각</b> 기준으로 마감 여부를 다시 판정합니다.</div>";
  h += "</div>";

  if (isWorkday(tdy, H)) {
    const rule = S.typeRules[dT.type] || { late: true, photo: true };

    /* 워킹사진 */
    if (rule.photo) {
      const photos = photoList(dT);
      const okCnt = photoOkCount(dT, tdy, S);
      const pFrom = atTime(tdy, S.photoFrom || "10:00"), pTo = atTime(tdy, S.photoTo || "23:59") + 59999;
      const inWin = Date.now() >= pFrom && Date.now() <= pTo;
      h += '<div class="sec-t">워킹사진 보고 · ' + fmtD(tdy) + "</div>" +
        '<div class="card"><div class="card-h"><h3>🖼 워킹사진</h3><div class="sp"></div>' +
        (okCnt >= S.photoMin ? '<span class="bdg g">완료</span>' : '<span class="bdg y">' + okCnt + "/" + S.photoMin + "</span>") + "</div>" +
        '<div class="banner ' + (okCnt >= S.photoMin ? "s" : inWin ? "i" : "w") + '">인정 시간 <b>' +
        (S.photoFrom || "10:00") + " ~ " + (S.photoTo || "23:59") + "</b> · " + S.photoMin + "장 이상이면 자동 완료 · 미달 시 " + won(S.photoFine) +
        (inWin ? "" : "<br>지금은 인정 시간이 아닙니다. 올려도 집계에 포함되지 않습니다.") + "</div>" +
        '<div class="photo-grid">' +
        photos.map((x, i) => {
          const good = x.at == null || (x.at >= pFrom && x.at <= pTo);
          return '<div class="ph" style="' + (good ? "" : "opacity:.45") + '"><img src="' + x.u + '" data-img="' + x.u + '" data-imgt="워킹사진 ' + (i + 1) + (x.at ? " · " + tsHM(x.at) : "") + '">' +
            '<button class="x" data-delph="' + i + '">✕</button>' +
            (x.at ? '<div style="position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;text-align:center;padding:2px">' +
              tsHM(x.at) + (good ? "" : " 미인정") + "</div>" : "") + "</div>";
        }).join("") +
        (photos.length < 12 ? '<button class="add" id="phAdd"><span style="font-size:20px">＋</span>사진 추가</button>' : "") +
        "</div>" +
        '<input type="file" accept="image/*" id="phFile" class="hide" multiple></div>';
    }

    /* 일마감 체크리스트 */
    if (S.closingForAll || dT.type !== "개직") {
      const items = todayItems(p, dT);
      const from = atTime(tdy, S.closingFrom), to = atTime(tdy, S.closingTo) + 59000;
      const saved = dT.closingSavedAt || 0;
      const ok = saved >= from && saved <= to;
      const nowInWindow = Date.now() >= from && Date.now() <= to;
      h += '<div class="sec-t">일마감 · ' + fmtD(tdy) + "</div>" +
        '<div class="card"><div class="card-h"><h3>📋 일마감 체크리스트</h3><div class="sp"></div>' +
        (ok ? '<span class="bdg g">완료</span>' : '<span class="bdg y">미완료</span>') + "</div>" +
        '<div class="banner ' + (ok ? "s" : nowInWindow ? "i" : "w") + '">' +
        (ok ? "✅ " + tsFmt(saved) + " 저장 완료 — 이후 수정은 자유롭게 하셔도 벌금과 무관합니다."
            : nowInWindow ? "오늘 <b>" + S.closingFrom + " ~ " + S.closingTo + "</b> 사이에 <b>저장하기</b>를 한 번만 누르면 인정됩니다."
            : "인정 시간은 <b>" + S.closingFrom + " ~ " + S.closingTo + "</b> 입니다. 지금 저장해도 벌금은 면제되지 않습니다.") +
        "</div>" +
        '<div id="ckList">' + items.map((it, i) =>
          '<div class="ck ' + (it.done ? "done" : "") + '">' +
          '<div class="box" data-cktog="' + i + '">' + (it.done ? "✓" : "") + "</div>" +
          '<div class="tx" contenteditable="true" data-cktx="' + i + '">' + esc(it.t) + "</div>" +
          '<button class="del" data-ckdel="' + i + '">✕</button></div>').join("") +
        (items.length ? "" : '<div class="empty">항목을 추가해 나만의 일마감 목록을 만들어보세요.<br>한 번 만들면 다음날에도 그대로 불러옵니다.</div>') +
        "</div>" +
        '<div class="btn-row" style="margin-top:10px">' +
        '<button class="btn sm" id="ckAdd">＋ 항목 추가</button>' +
        '<div style="flex:1"></div>' +
        '<span class="hint" style="margin:0">' + items.filter(x => x.done).length + " / " + items.length + " 완료</span></div>" +
        '<button class="btn pri full" id="ckSave" style="margin-top:12px">저장하기</button>' +
        '<div class="hint" style="text-align:center;margin-top:8px">체크는 양심에 맡깁니다 · 저장 시각만 기록됩니다</div></div>';
    }
  }

  /* 최근 기록 */
  const rows = [];
  for (let i = 1; i <= 21 && rows.length < 10; i++) {
    const ds = addDays(tdy, -i);
    if (!isWorkday(ds, H)) continue;
    rows.push({ ds, dd: DB.get("daily", dayId(p.uid, ds)) || {} });
  }
  h += '<div class="sec-t">최근 근무 기록</div><div class="card pad0"><div class="tw"><table>' +
    "<thead><tr><th>날짜</th><th>유형</th><th>출근</th><th class='num'>사진</th><th>일마감</th></tr></thead><tbody>" +
    (rows.length ? rows.map(r => {
      const from = atTime(r.ds, S.closingFrom), to = atTime(r.ds, S.closingTo) + 59000;
      const cs = r.dd.closingSavedAt || 0;
      return "<tr data-open-day='" + r.ds + "' data-uid='" + p.uid + "' style='cursor:pointer'><td>" + fmtD(r.ds) + "</td>" +
        "<td>" + (r.dd.type ? '<span class="bdg ' + TYPES[r.dd.type].color + '">' + r.dd.type + "</span>" : '<span class="bdg r">미보고</span>') + "</td>" +
        "<td class='mono'>" + (tsHM(r.dd.checkinAt) || "-") + "</td>" +
        "<td class='num'>" + photoOkCount(r.dd, r.ds, S) + "</td>" +
        "<td>" + (cs >= from && cs <= to ? "✅" : "—") + "</td></tr>";
    }).join("") : "<tr><td colspan='5'><div class='empty'>기록 없음</div></td></tr>") +
    "</tbody></table></div></div>";
  return h;
}

function bindReport() {
  const p = Auth.profile, S = SET(), H = HOLIDAYS(), tdy = today();
  const rDate = nextReportDate(H, S);
  let sel = (DB.get("daily", dayId(p.uid, rDate)) || {}).type || null;

  $$("[data-type]").forEach(b => b.onclick = () => {
    if (b.disabled) return;
    sel = b.dataset.type;
    $$("[data-type]").forEach(x => x.classList.toggle("on", x.dataset.type === sel));
    $("#reasonWrap").classList.toggle("hide", sel !== "직출");
    $("#hospWrap").classList.toggle("hide", sel !== "병원근무");
  });

  /* 직출 증빙 이미지 */
  const rzUp = $("#rzUp"), rzFile = $("#rzFile");
  if (rzUp) rzUp.onclick = () => rzFile.click();
  if (rzFile) rzFile.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      toast("이미지 처리 중…");
      const raw = await compressImage(f, 900, .72);
      const url = await DB.uploadImage(raw, "reason");
      await DB.set("daily", dayId(p.uid, rDate), { uid: p.uid, date: rDate, reasonPhoto: url, updatedAt: Date.now() });
      toast("증빙 이미지 첨부됨", "ok");
    } catch (er) { toast(cleanErr(er), "err"); }
  };

  const sv = $("#rSave");
  if (sv) sv.onclick = async () => {
    if (!sel) return toast("근무 유형을 선택해주세요", "err");
    const reason = $("#rReason") ? $("#rReason").value.trim() : "";
    const hosp = $("#rHosp") ? $("#rHosp").value.trim() : "";
    if (sel === "직출" && !reason) return toast("직출은 사유를 반드시 입력해주세요", "err");
    if (sel === "병원근무" && !hosp) return toast("병원근무는 병원명을 입력해주세요", "err");
    const cur = DB.get("daily", dayId(p.uid, rDate)) || {};
    const wasUsed = !!cur.gaejikUsed;
    let used = wasUsed;
    try {
      sv.disabled = true;
      if (sel === "개직" && !wasUsed) {
        if (Number(Auth.profile.gaejik || 0) < 1) { sv.disabled = false; return toast("개직 잔여가 없습니다", "err"); }
        await changeGaejik(p.uid, -1, "개직 사용 · " + fmtDL(rDate)); used = true;
      } else if (sel !== "개직" && wasUsed) {
        await changeGaejik(p.uid, +1, "개직 취소 · " + fmtDL(rDate) + " → " + sel); used = false;
      }
      await DB.set("daily", dayId(p.uid, rDate), {
        uid: p.uid, date: rDate, type: sel,
        reason: sel === "직출" ? reason : "",
        hospital: sel === "병원근무" ? hosp : "",
        reportAt: Date.now(), gaejikUsed: used, updatedAt: Date.now()
      });
      const dl = reportDeadlineTs(rDate, sel, S);
      toast(Date.now() > dl ? sel + " 보고 저장 · 마감 후 제출로 벌금 대상입니다" : sel + " 보고 완료", Date.now() > dl ? "err" : "ok");
    } catch (e) { toast(cleanErr(e), "err"); sv.disabled = false; }
  };

  /* 워킹사진 */
  const phAdd = $("#phAdd"), phFile = $("#phFile");
  if (phAdd) phAdd.onclick = () => phFile.click();
  if (phFile) phFile.onchange = async e => {
    const files = Array.from(e.target.files || []); if (!files.length) return;
    try {
      toast("사진 " + files.length + "장 처리 중…");
      const cur = DB.get("daily", dayId(p.uid, tdy)) || {};
      const arr = photoList(cur);
      for (const f of files) {
        const raw = await compressImage(f, 800, .7);
        arr.push({ u: await DB.uploadImage(raw, "walk"), at: Date.now() });
      }
      await DB.set("daily", dayId(p.uid, tdy), {
        uid: p.uid, date: tdy, photos: arr, photoAt: Date.now(), updatedAt: Date.now()
      });
      const ok = photoOkCount({ photos: arr }, tdy, S);
      toast(ok >= S.photoMin ? "워킹사진 " + ok + "장 · 완료 👍" : "저장됨 · 인정 " + ok + "/" + S.photoMin + "장", ok >= S.photoMin ? "ok" : "err");
    } catch (er) { toast(cleanErr(er), "err"); }
  };
  $$("[data-delph]").forEach(b => b.onclick = async () => {
    const i = Number(b.dataset.delph);
    const cur = DB.get("daily", dayId(p.uid, tdy)) || {};
    const arr = photoList(cur); arr.splice(i, 1);
    await DB.set("daily", dayId(p.uid, tdy), { uid: p.uid, date: tdy, photos: arr, updatedAt: Date.now() });
    toast("삭제됨");
  });

  /* 일마감 체크리스트 */
  const dT = DB.get("daily", dayId(p.uid, tdy)) || {};
  const items = todayItems(p, dT);
  $$("[data-cktog]").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.cktog); items[i].done = !items[i].done; render();
  });
  $$("[data-ckdel]").forEach(b => b.onclick = () => {
    const i = Number(b.dataset.ckdel); items.splice(i, 1); render();
  });
  $$("[data-cktx]").forEach(el => el.onblur = () => { items[Number(el.dataset.cktx)].t = el.textContent.trim(); });
  const add = $("#ckAdd");
  if (add) add.onclick = () => {
    items.push({ t: "", done: false }); render();
    setTimeout(() => { const list = $$("[data-cktx]"); const last = list[list.length - 1]; if (last) last.focus(); }, 60);
  };
  const save = $("#ckSave");
  if (save) save.onclick = async () => {
    $$("[data-cktx]").forEach(el => { items[Number(el.dataset.cktx)].t = el.textContent.trim(); });
    const clean = items.filter(x => x.t);
    ckItems = clean;
    const now = Date.now();
    await DB.set("daily", dayId(p.uid, tdy), {
      uid: p.uid, date: tdy, closingItems: clean, closingSavedAt: now, updatedAt: now
    });
    await DB.set("users", p.uid, { checklist: clean.map(x => x.t) });
    const from = atTime(tdy, S.closingFrom), to = atTime(tdy, S.closingTo) + 59000;
    toast(now >= from && now <= to ? "일마감 저장 완료 👍" : "저장됨 · 인정 시간(" + S.closingFrom + "~" + S.closingTo + ") 밖입니다",
      now >= from && now <= to ? "ok" : "err");
  };
}

let fineFilterUser = "all", fineMonth = "all", fineSel = new Set();

function viewFines() {
  const admin = Auth.isAdmin(), S = SET(), p = Auth.profile;
  const all = admin ? collectFines({}) : collectFines({ uid: p.uid });
  const tab = App.finesTab;

  let list = all.filter(f => !f.pending);
  if (tab === "unpaid") list = list.filter(f => !f.waived && f.status === "unpaid");
  else if (tab === "submitted") list = list.filter(f => f.status === "submitted");
  else if (tab === "paid") list = list.filter(f => f.status === "paid");
  else if (tab === "waived") list = list.filter(f => f.waived);
  if (admin && fineFilterUser !== "all") list = list.filter(f => f.uid === fineFilterUser);
  if (fineMonth !== "all") list = list.filter(f => f.date.startsWith(fineMonth));
  const months = Array.from(new Set(all.map(f => monthOf(f.date)))).sort().reverse();

  let h = '<div class="card"><div class="card-h"><h3>💳 벌금 입금 계좌</h3></div>' +
    '<div class="acct"><span class="t">' + esc(S.account) + '</span><button class="btn xs" id="cpA">복사</button></div>' +
    '<div class="hint" style="margin-top:9px">입금 후 이체 캡쳐를 올리면 관리자가 확인합니다. 여러 건을 한 번에 묶어서도 가능합니다.</div></div>';

  h += '<div class="grid g3">' +
    '<div class="stat acc-r"><div class="lb">미납</div><div class="vl" style="font-size:18px">' + won(sumFines(all, f => f.status === "unpaid" && !f.waived)) + "</div></div>" +
    '<div class="stat acc-b"><div class="lb">확인대기</div><div class="vl" style="font-size:18px">' + won(sumFines(all, f => f.status === "submitted")) + "</div></div>" +
    '<div class="stat acc-g"><div class="lb">납부완료</div><div class="vl" style="font-size:18px">' + won(sumFines(all, f => f.status === "paid")) + "</div></div></div>";

  h += '<div class="seg sm" style="margin:14px 0 12px">' +
    [["unpaid", "미납"], ["submitted", "확인대기"], ["paid", "완료"], ["waived", "포인트납입"], ["all", "전체"]]
      .map(([k, t]) => '<button data-ftab="' + k + '" class="' + (tab === k ? "on" : "") + '">' + t + "</button>").join("") + "</div>";

  h += '<div class="btn-row" style="margin-bottom:12px">' +
    (admin ? "<select class='inp' id='fUser' style='flex:1;min-width:118px;padding:8px 26px 8px 10px;font-size:13px'>" +
      "<option value='all'>전체 팀원</option>" +
      ACTIVE_USERS().map(u => "<option value='" + u.uid + "'" + (fineFilterUser === u.uid ? " selected" : "") + ">" + esc(u.name) + "</option>").join("") + "</select>" : "") +
    "<select class='inp' id='fMon' style='flex:1;min-width:118px;padding:8px 26px 8px 10px;font-size:13px'>" +
    "<option value='all'>전체 기간</option>" +
    months.map(m => "<option value='" + m + "'" + (fineMonth === m ? " selected" : "") + ">" + m.replace("-", "년 ") + "월</option>").join("") + "</select>" +
    (admin ? "<button class='btn sm' id='addFine'>+ 추가</button>" : "") + "</div>";

  const selectable = tab === "unpaid" || tab === "submitted";
  if (selectable && list.length) {
    h += '<div class="card" style="padding:11px 13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">' +
      '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700">' +
      '<input type="checkbox" id="selAll"> 전체선택</label>' +
      '<span class="bdg n" id="selInfo">0건</span><div style="flex:1"></div>' +
      (admin ? '<button class="btn xs" id="copyBill">📋 정산문구</button>' : "") +
      (tab === "unpaid" ? '<button class="btn xs pri" id="payBtn">💸 납부 캡쳐</button>' : "") +
      (admin && tab === "submitted" ? '<button class="btn xs ok" id="confirmBtn">✅ 납부확인</button>' : "") +
      (admin ? '<button class="btn xs" id="waiveBtn">🎫 포인트납입</button>' : "") +
      (admin ? '<button class="btn xs dan" id="delBtn">삭제</button>' : "") + "</div>";
  }

  const LCAP = 80;
  h += '<div class="card pad0">' +
    (list.length ? list.slice(0, LCAP).map(f =>
      '<div class="row">' +
      (selectable ? '<input type="checkbox" class="fsel" data-fid="' + f.id + '" style="width:17px;height:17px;flex:0 0 auto">' : "") +
      '<span style="font-size:17px">' + (KINDS[f.kind] || KINDS.etc).icon + "</span>" +
      '<div class="sp" data-open-fine="' + f.id + '" style="cursor:pointer">' +
      '<div class="nm">' + (admin ? esc(f.name) + " · " : "") + (KINDS[f.kind] || KINDS.etc).label +
      (f.auto ? "" : ' <span class="bdg n">수동</span>') + "</div>" +
      '<div class="ds">' + fmtD(f.date) + " · " + esc(f.reason) + "</div></div>" +
      '<div style="text-align:right"><div class="nm mono" style="' + (f.waived ? "text-decoration:line-through;color:var(--tx3)" : "") + '">' + won(f.amount) + "</div>" +
      '<div style="margin-top:3px">' + fineBadge(f) + "</div></div></div>").join("") +
      (list.length > LCAP ? '<div class="empty">…외 ' + (list.length - LCAP) + "건 · 필터로 좁혀보세요</div>" : "")
      : '<div class="empty">해당하는 벌금이 없습니다</div>') + "</div>";

  if (list.length)
    h += '<div class="stat" style="margin-top:12px"><div class="lb">목록 합계</div>' +
      '<div class="vl">' + won(list.filter(f => !f.waived).reduce((s, f) => s + f.amount, 0)) + "</div>" +
      '<div class="sub">' + list.length + "건</div></div>";
  return h;
}

function bindFines() {
  const admin = Auth.isAdmin();
  $("#cpA").onclick = () => { copyText(SET().account); toast("계좌 복사됨", "ok"); };
  $$("[data-ftab]").forEach(b => b.onclick = () => { App.finesTab = b.dataset.ftab; fineSel.clear(); render(); });
  const fu = $("#fUser"); if (fu) fu.onchange = e => { fineFilterUser = e.target.value; render(); };
  const fm = $("#fMon"); if (fm) fm.onchange = e => { fineMonth = e.target.value; render(); };
  const af = $("#addFine"); if (af) af.onclick = openAddFine;

  const boxes = $$(".fsel"), info = $("#selInfo");
  const all = collectFines(admin ? {} : { uid: Auth.profile.uid });
  const upd = () => {
    fineSel = new Set(boxes.filter(b => b.checked).map(b => b.dataset.fid));
    const sum = all.filter(f => fineSel.has(f.id)).reduce((s, f) => s + f.amount, 0);
    if (info) info.textContent = fineSel.size + "건 · " + won(sum);
  };
  boxes.forEach(b => { b.checked = fineSel.has(b.dataset.fid); b.onchange = upd; });
  const sa = $("#selAll"); if (sa) sa.onchange = () => { boxes.forEach(b => b.checked = sa.checked); upd(); };
  upd();
  const picked = () => all.filter(f => fineSel.has(f.id));

  const cb = $("#copyBill");
  if (cb) cb.onclick = () => { const ps = picked(); if (!ps.length) return toast("항목을 선택해주세요", "err"); showBill(ps); };
  const pb = $("#payBtn");
  if (pb) pb.onclick = () => { const ps = picked(); if (!ps.length) return toast("납부한 항목을 선택해주세요", "err"); openPayModal(ps); };
  const cf = $("#confirmBtn");
  if (cf) cf.onclick = async () => {
    const ps = picked(); if (!ps.length) return toast("항목을 선택해주세요", "err");
    for (const f of ps) await DB.set("fines", f.id, Object.assign(baseFine(f), {
      status: "paid", confirmedAt: Date.now(), confirmedBy: Auth.profile.name }));
    fineSel.clear(); toast(ps.length + "건 납부확인 완료", "ok");
  };
  const wb = $("#waiveBtn");
  if (wb) wb.onclick = async () => {
    const ps = picked(); if (!ps.length) return toast("항목을 선택해주세요", "err");
    const on = !ps[0].waived;
    for (const f of ps) await DB.set("fines", f.id, Object.assign(baseFine(f), { waived: on }));
    fineSel.clear(); toast(ps.length + "건 " + (on ? "포인트납입 처리" : "포인트납입 해제"), "ok");
  };
  const db = $("#delBtn");
  if (db) db.onclick = () => {
    const ps = picked(); if (!ps.length) return toast("항목을 선택해주세요", "err");
    confirmM("선택한 <b>" + ps.length + "건</b>을 삭제합니다.<br>삭제한 벌금은 목록·합계·순위에서 모두 사라집니다.", async () => {
      for (const f of ps) await deleteFine(f);
      fineSel.clear(); toast(ps.length + "건 삭제됨", "ok");
    });
  };
}

function baseFine(f) {
  return { id: f.id, uid: f.uid, date: f.date, kind: f.kind, amount: f.amount, memo: f.reason, manual: !f.auto };
}
/** SM 전용 — 벌금 삭제 */
async function deleteFine(f) {
  if (!Auth.isAdmin()) throw new Error("권한이 없습니다");
  if (f.auto) await DB.set("fines", f.id, Object.assign(baseFine(f), { deleted: true, deletedAt: Date.now(), deletedBy: Auth.profile.name }));
  else await DB.del("fines", f.id);
}

function billText(fines) {
  const byUser = {};
  fines.filter(f => !f.waived && !f.pending).forEach(f => { (byUser[f.name] = byUser[f.name] || []).push(f); });
  let txt = "📌 벌금 정산\n", total = 0;
  Object.keys(byUser).forEach(n => {
    const sum = byUser[n].reduce((s, f) => s + f.amount, 0); total += sum;
    txt += "\n▪ " + n + " — " + won(sum) + "\n";
    byUser[n].sort((a, b) => a.date.localeCompare(b.date)).forEach(f => {
      txt += "   · " + fmtD(f.date) + " " + (KINDS[f.kind] || KINDS.etc).label + " " + won(f.amount) + "\n";
    });
  });
  txt += "\n합계 " + won(total) + "\n▶ " + SET().account;
  return txt;
}
function showBill(finesOrText) {
  const txt = typeof finesOrText === "string" ? finesOrText : billText(finesOrText);
  copyText(txt);
  modal({ title: "정산 문구", noFooter: true,
    body: '<textarea class="inp" style="min-height:240px;font-size:12.5px" readonly>' + esc(txt) + "</textarea>" +
      '<div class="hint">클립보드에 복사되었습니다. 카톡방에 붙여넣으세요.</div>' });
}

/* ============================ 납부 캡쳐 업로드 ============================ */
function openPayModal(fines, urgent) {
  const total = fines.reduce((s, f) => s + f.amount, 0);
  let imgRaw = null;
  modal({
    title: urgent ? "⚠️ 미납 벌금이 있습니다" : "납부 캡쳐 올리기",
    body:
      '<div class="banner d"><b>' + fines.length + "건 · " + won(total) + "</b><br>" +
      fines.slice(0, 8).map(f => "· " + fmtD(f.date) + " " + (KINDS[f.kind] || KINDS.etc).label + " " + won(f.amount) +
        " <span style='opacity:.7'>(" + esc(f.reason) + ")</span>").join("<br>") +
      (fines.length > 8 ? "<br>… 외 " + (fines.length - 8) + "건" : "") + "</div>" +
      '<div class="fld"><label>입금 계좌</label><div class="acct"><span class="t">' + esc(SET().account) + "</span>" +
      '<button class="btn xs" id="pmCp">복사</button></div></div>' +
      '<div class="upl" id="pmUp"><div class="ic">🧾</div><div class="t">이체 완료 캡쳐 올리기</div>' +
      '<div class="s">관리자가 확인 후 납부완료 처리합니다</div></div>' +
      '<input type="file" accept="image/*" id="pmFile" class="hide">' +
      '<div id="pmPrev"></div>' +
      '<div class="fld" style="margin-top:13px"><label>메모 (선택)</label>' +
      '<input class="inp" id="pmMemo" placeholder="예: 급여일 일괄납부"></div>',
    okText: "납부 등록", cancelText: urgent ? "나중에" : "닫기",
    onOk: async () => {
      if (!imgRaw) { toast("납부 캡쳐를 첨부해주세요", "err"); return false; }
      toast("업로드 중…");
      const img = await DB.uploadImage(imgRaw, "pay");
      const batch = uid8(), memo = $("#pmMemo").value.trim();
      for (const f of fines) {
        await DB.set("fines", f.id, Object.assign(baseFine(f), {
          status: "submitted", proof: img, proofAt: Date.now(),
          proofBy: Auth.profile.name, batch, payMemo: memo
        }));
      }
      fineSel.clear();
      toast("납부 등록 완료 · 관리자 확인을 기다려주세요", "ok");
    },
    after: () => {
      $("#pmCp").onclick = () => { copyText(SET().account); toast("복사됨", "ok"); };
      $("#pmUp").onclick = () => $("#pmFile").click();
      $("#pmFile").onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        imgRaw = await compressImage(f, 900, .72);
        $("#pmPrev").innerHTML = '<img src="' + imgRaw + '" class="thumb" style="margin-top:11px">';
      };
    }
  });
}
