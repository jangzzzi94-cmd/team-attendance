let calUser = "all";
function viewCal() {
  const admin = Auth.isAdmin(), H = HOLIDAYS(), tdy = today();
  const [Y, M] = App.month.split("-").map(Number);
  const first = new Date(Y, M - 1, 1), last = new Date(Y, M, 0);
  const from = App.month + "-01", to = App.month + "-" + pad(last.getDate());
  const opt = { from, to };
  if (calUser !== "all") opt.uid = calUser;
  const fines = collectFines(opt).filter(f => !f.pending);
  const byDate = {};
  fines.forEach(f => { (byDate[f.date] = byDate[f.date] || []).push(f); });

  /* 개직 사용 내역 */
  const calUsers = calUser !== "all" ? USERS().filter(u => u.uid === calUser) : ACTIVE_USERS();
  const gjBy = {};
  calUsers.forEach(u => {
    for (let dd = 1; dd <= last.getDate(); dd++) {
      const ds2 = App.month + "-" + pad(dd);
      const rec = DB.get("daily", dayId(u.uid, ds2));
      if (rec && rec.type === "개직") (gjBy[ds2] = gjBy[ds2] || []).push(u.name);
    }
  });
  const gjTotal = Object.values(gjBy).reduce((a, b) => a + b.length, 0);

  let h = '<div class="card"><div class="btn-row" style="align-items:center">' +
    '<button class="btn sm" id="mPrev">‹</button>' +
    '<div style="flex:1;text-align:center;font-size:17px;font-weight:800;letter-spacing:-.5px">' + Y + "년 " + M + "월</div>" +
    '<button class="btn sm" id="mNext">›</button>' +
    '<button class="btn sm" id="mNow">이번달</button></div>' +
    "<select class='inp' id='calU' style='margin-top:11px;padding:8px 26px 8px 10px;font-size:13px'>" +
    "<option value='all'>전체 팀원</option>" +
    ACTIVE_USERS().map(u => "<option value='" + u.uid + "'" + (calUser === u.uid ? " selected" : "") + ">" + esc(u.name) + "</option>").join("") +
    "</select></div>";

  h += '<div class="grid g3" style="margin-bottom:12px">' +
    '<div class="stat acc-r"><div class="lb">' + M + '월 벌금</div><div class="vl" style="font-size:18px">' + won(sumFines(fines)) + "</div></div>" +
    '<div class="stat"><div class="lb">건수</div><div class="vl" style="font-size:18px">' + fines.filter(f => !f.waived).length + "</div></div>" +
    '<div class="stat acc-p"><div class="lb">개직 사용</div><div class="vl" style="font-size:18px">' + gjTotal + "건</div></div></div>";

  h += '<div class="card"><div class="cal">' +
    DOWK.map((d, i) => '<div class="dw ' + (i === 0 ? "s" : i === 6 ? "u" : "") + '">' + d + "</div>").join("");
  for (let i = 0; i < first.getDay(); i++) h += "<div></div>";
  for (let day = 1; day <= last.getDate(); day++) {
    const ds = App.month + "-" + pad(day);
    const w = dow(ds), wd = isWorkday(ds, H), hn = holidayName(ds, H);
    const fs = (byDate[ds] || []).slice().sort((a, b) => a.name.localeCompare(b.name, "ko"));
    h += '<div class="cel' + (wd ? "" : " off") + (ds === tdy ? " tod" : "") + (hn ? " hol" : "") + '" data-cal="' + ds + '">' +
      '<div class="dn ' + (w === 0 ? "s" : w === 6 ? "u" : "") + '">' + day + "</div>" +
      (gjBy[ds] || []).map(n => '<div class="ev g">' + esc(n) + "<br>🌴 개직</div>").join("") +
      fs.map(f => '<div class="ev ' + (f.waived ? "c" : f.status === "paid" ? "g" : (KINDS[f.kind] || KINDS.etc).color) + '" style="position:relative;padding-right:16px">' +
        esc(f.name) + "<br>" + (KINDS[f.kind] || KINDS.etc).label + "<br>" + (f.amount || 0).toLocaleString("ko-KR") +
        (Auth.isAdmin() ? '<button data-calx="' + f.id + '" title="삭제" style="position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:4px;background:rgba(0,0,0,.2);color:#fff;font-size:9px;line-height:1;display:flex;align-items:center;justify-content:center">✕</button>' : "") +
        "</div>").join("") +
      "</div>";
  }
  h += "</div></div>";

  h += '<div class="sec-t">' + M + "월 상세 (" + fines.length + "건)</div><div class='card pad0'>" +
    (fines.length ? fines.slice(0, 60).map(fineRow).join("") +
      (fines.length > 60 ? '<div class="empty">…외 ' + (fines.length - 60) + "건</div>" : "")
      : '<div class="empty">이번달 벌금이 없습니다 🎉</div>') + "</div>";
  return h;
}

function bindCal() {
  const shift = n => {
    let [Y, M] = App.month.split("-").map(Number);
    M += n; if (M < 1) { M = 12; Y--; } if (M > 12) { M = 1; Y++; }
    App.month = Y + "-" + pad(M); render();
  };
  $("#mPrev").onclick = () => shift(-1);
  $("#mNext").onclick = () => shift(1);
  $("#mNow").onclick = () => { App.month = monthOf(today()); render(); };
  const cu = $("#calU"); if (cu) cu.onchange = e => { calUser = e.target.value; render(); };
  $$("[data-cal]").forEach(c => c.onclick = () => openCalDay(c.dataset.cal));
  $$("[data-open-fine]").forEach(b => b.onclick = () => openFineModal(b.dataset.openFine));
  $$("[data-calx]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const f = collectFines({}).find(x => x.id === b.dataset.calx);
    if (!f) return;
    confirmM("<b>" + esc(f.name) + "</b> · " + fmtD(f.date) + " " + (KINDS[f.kind] || KINDS.etc).label +
      " " + won(f.amount) + "<br>이 벌금을 삭제할까요?", async () => { await deleteFine(f); toast("삭제됨", "ok"); });
  });
}

function openCalDay(date) {
  const H = HOLIDAYS(), S = SET();
  const opt = { from: date, to: date };
  if (calUser !== "all") opt.uid = calUser;
  const fines = collectFines(opt).filter(f => !f.pending);
  const users = calUser === "all" ? ACTIVE_USERS() : ACTIVE_USERS().filter(u => u.uid === calUser);
  const hn = holidayName(date, H), wd = isWorkday(date, H);

  modal({
    title: fmtDL(date), cancelText: "닫기",
    body:
      '<div class="btn-row" style="margin-bottom:13px">' +
      '<span class="bdg ' + (wd ? "b" : "n") + '">' + (wd ? "근무일" : "휴무일") + "</span>" +
      (hn ? '<span class="bdg y">' + esc(hn) + "</span>" : "") +
      (fines.length ? '<span class="bdg r">벌금 ' + won(sumFines(fines)) + "</span>" : '<span class="bdg g">벌금 없음</span>') + "</div>" +
      '<div class="sec-t" style="margin-top:0">근무 현황</div><div class="card pad0" style="margin:0 0 14px">' +
      users.map(u => {
        const d = DB.get("daily", dayId(u.uid, date)) || {};
        return '<div class="row" data-open-day="' + date + '" data-uid="' + u.uid + '" style="cursor:pointer">' +
          (d.checkinPhoto ? '<img src="' + d.checkinPhoto + '" class="thumb sm">' : '<div class="avatar">' + esc(initial(u.name)) + "</div>") +
          '<div class="sp"><div class="nm">' + esc(u.name) + "</div>" +
          '<div class="ds">' + (tsHM(d.checkinAt) ? "출근 " + tsHM(d.checkinAt) : "출근 미등록") +
          " · 사진 " + ((d.photos || []).length) + "</div></div>" +
          (d.type ? '<span class="bdg ' + TYPES[d.type].color + '">' + d.type + "</span>" : '<span class="bdg r">미보고</span>') + "</div>";
      }).join("") + "</div>" +

    after: () => {
      $$("[data-open-fine]", $("#ovl")).forEach(b => b.onclick = () => openFineModal(b.dataset.openFine));
      $$("[data-open-day]", $("#ovl")).forEach(b => b.onclick = () => openDayModal(b.dataset.openDay, b.dataset.uid));
    }
  });
}

function viewRank() {
  const p = Auth.profile, S = SET();
  const tab = App.rankTab;
  const ym = App.month;
  const [Y, M] = ym.split("-").map(Number);
  const last = new Date(Y, M, 0);
  const fines = collectFines({ from: ym + "-01", to: ym + "-" + pad(last.getDate()) }).filter(f => !f.pending);

  let h = '<div class="card"><div class="btn-row" style="align-items:center">' +
    '<button class="btn sm" id="rPrev">‹</button>' +
    '<div style="flex:1;text-align:center;font-size:16px;font-weight:800">' + Y + "년 " + M + "월</div>" +
    '<button class="btn sm" id="rNext">›</button>' +
    '<button class="btn sm" id="rNow">이번달</button></div></div>';

  h += '<div class="seg sm" style="margin-bottom:12px">' +
    [["fine", "벌금 순위"], ["gaejik", "개직 순위"], ["log", "개직 로그"]]
      .map(([k, t]) => '<button data-rtab="' + k + '" class="' + (tab === k ? "on" : "") + '">' + t + "</button>").join("") + "</div>";

  if (tab === "fine") {
    const map = {};
    ACTIVE_USERS().forEach(u => map[u.uid] = { u, total: 0, unpaid: 0, cnt: 0 });
    fines.filter(f => !f.waived).forEach(f => {
      const m = map[f.uid]; if (!m) return;
      m.total += f.amount; m.cnt++;
      if (f.status !== "paid") m.unpaid += f.amount;
    });
    const arr = Object.values(map).sort((a, b) => b.total - a.total || a.u.name.localeCompare(b.u.name, "ko"));
    const max = Math.max(1, arr.length ? arr[0].total : 1);
    const sum = arr.reduce((s, x) => s + x.total, 0);

    h += '<div class="grid g2"><div class="stat acc-r"><div class="lb">' + M + '월 팀 전체</div>' +
      '<div class="vl" style="font-size:19px">' + won(sum) + "</div></div>" +
      '<div class="stat"><div class="lb">내 순위</div><div class="vl">' +
      ((arr.findIndex(x => x.u.uid === p.uid) + 1) || "-") + "<span style='font-size:13px;color:var(--tx3)'>/" + arr.length + "</span></div></div></div>";

    h += '<div class="sec-t">' + M + "월 벌금 순위</div><div class='card pad0'>" +
      (arr.length ? arr.map((x, i) =>
        '<div class="row">' +
        '<div class="rk ' + (x.total > 0 ? (i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : "") : "") + '">' + (i + 1) + "</div>" +
        '<div class="sp"><div class="nm">' + esc(x.u.name) +
        (x.u.uid === p.uid ? ' <span class="bdg b">나</span>' : "") +
        ' <span class="bdg ' + gradeInfo(x.u).color + '">' + esc(gradeOf(x.u)) + "</span></div>" +
        '<div style="height:5px;background:#eef1f6;border-radius:3px;margin-top:6px;overflow:hidden">' +
        '<div style="height:100%;width:' + Math.round(x.total / max * 100) + '%;background:linear-gradient(90deg,#ff8a7a,var(--dan));border-radius:3px"></div></div>' +
        '<div class="ds">' + x.cnt + "건" + (x.unpaid ? " · 미납 " + won(x.unpaid) : " · 전액 납부") + "</div></div>" +
        '<div style="text-align:right"><div style="font-size:17px;font-weight:800;color:' + (x.total ? "var(--dan)" : "var(--tx3)") + '">' +
        won(x.total) + "</div></div></div>").join("") : '<div class="empty">데이터가 없습니다</div>') + "</div>";
  }

  if (tab === "gaejik") {
    const users = ACTIVE_USERS().slice().sort((a, b) => Number(b.gaejik || 0) - Number(a.gaejik || 0) || a.name.localeCompare(b.name, "ko"));
    const max = Math.max(1, users.length ? Number(users[0].gaejik || 0) : 1);
    h += '<div class="grid g2">' +
      '<div class="stat acc-p"><div class="lb">내 개직 잔여</div><div class="vl">' + Number(p.gaejik || 0) + "</div>" +
      '<div class="sub">매달 +' + S.monthlyGaejik + " · 무벌금 +" + S.cleanBonus + " · 생일 +" + S.birthdayGaejik + "</div></div>" +
      '<div class="stat"><div class="lb">팀 전체 보유</div><div class="vl">' +
      users.reduce((s, u) => s + Number(u.gaejik || 0), 0) + "</div></div></div>";
    h += '<div class="sec-t">개직 보유 순위</div><div class="card pad0">' +
      (users.length ? users.map((u, i) =>
        '<div class="row"><div class="rk ' + (i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : "") + '">' + (i + 1) + "</div>" +
        '<div class="sp"><div class="nm">' + esc(u.name) + (u.uid === p.uid ? ' <span class="bdg b">나</span>' : "") +
        (u.birth && Number(u.birth.split("-")[1]) === new Date().getMonth() + 1 ? ' <span class="bdg p">🎂 이번달</span>' : "") + "</div>" +
        '<div style="height:5px;background:#eef1f6;border-radius:3px;margin-top:6px;overflow:hidden">' +
        '<div style="height:100%;width:' + Math.round(Number(u.gaejik || 0) / max * 100) + '%;background:linear-gradient(90deg,#b79cff,var(--pur));border-radius:3px"></div></div></div>' +
        '<div style="text-align:right"><div style="font-size:19px;font-weight:800;color:var(--pur)">' + Number(u.gaejik || 0) + "</div>" +
        (Auth.isAdmin() ? '<button class="btn xs" data-gj="' + u.uid + '" style="margin-top:4px">조정</button>' : "") + "</div></div>").join("")
        : '<div class="empty">팀원이 없습니다</div>') + "</div>";
  }

  if (tab === "log") {
    const logs = DB.all("glog").sort((a, b) => (b.at || 0) - (a.at || 0));
    h += '<div class="card pad0">' +
      (logs.length ? logs.slice(0, 100).map(l =>
        '<div class="row"><span class="bdg ' + (l.delta > 0 ? "g" : "r") + '" style="min-width:38px;justify-content:center">' +
        (l.delta > 0 ? "+" : "") + l.delta + "</span>" +
        '<div class="sp"><div class="nm">' + esc(l.name) + ' <span style="color:var(--tx3);font-weight:600">· ' + esc(l.reason) + "</span></div>" +
        '<div class="ds">' + tsFmtFull(l.at) + " · " + esc(l.by || "-") + " · 이후 " + l.after + "개</div></div>" +
        (l.auto ? '<span class="bdg p">자동</span>' : '<span class="bdg n">수동</span>') + "</div>").join("")
        : '<div class="empty">변동 내역이 없습니다</div>') + "</div>";
  }
  return h;
}

function openGaejikModal(uid) {

    title: esc(u.name) + " 개직 조정",
    body: '<div class="stat acc-p" style="margin-bottom:14px"><div class="lb">현재 잔여</div>' +
      '<div class="vl">' + Number(u.gaejik || 0) + "개</div></div>" +

      '<div class="btn-row">' + ["연간 개직 부여", "특별 포상", "관리자 조정"].map(t =>
        '<button class="btn xs" data-gr="' + t + '">' + t + "</button>").join("") + "</div>",
    okText: "적용",
    onOk: async () => {
      const d = Number($("#gjV").textContent);
      const r = $("#gjR").value.trim() || (d > 0 ? "관리자 지급" : "관리자 차감");
      if (!d) { toast("증감 값을 지정해주세요", "err"); return false; }
      if (Number(u.gaejik || 0) + d < 0) { toast("잔여가 0 미만이 될 수 없습니다", "err"); return false; }
      await changeGaejik(uid, d, r);
      toast("개직 " + (d > 0 ? "+" : "") + d + "개 반영됨", "ok");
    },
    after: () => {
      const v = $("#gjV"); const set = n => v.textContent = (n > 0 ? "+" : "") + n;
      $("#gjP").onclick = () => set(Math.min(30, Number(v.textContent) + 1));
      $("#gjM").onclick = () => set(Math.max(-30, Number(v.textContent) - 1));
      $$("[data-gr]").forEach(b => b.onclick = () => $("#gjR").value = b.dataset.gr);
    }
  });
}

function adminPayLog() {
  const all = collectFines({});
  const submitted = all.filter(f => f.status === "submitted");
  const paid = all.filter(f => f.status === "paid").sort((a, b) => (b.confirmedAt || 0) - (a.confirmedAt || 0));
  const unpaidByUser = {};
  ACTIVE_USERS().forEach(u => unpaidByUser[u.uid] = { u, amt: 0, cnt: 0 });
  all.filter(f => !f.waived && !f.pending && f.status === "unpaid").forEach(f => {
    const m = unpaidByUser[f.uid]; if (m) { m.amt += f.amount; m.cnt++; }
  });

  const card = (f, showConfirm) =>
    '<div class="row">' +
    (f.proof ? '<img src="' + f.proof + '" class="thumb sm" style="cursor:pointer" data-img="' + f.proof + '" data-imgt="' + esc(f.name) + ' 납부 캡쳐">'
             : '<div class="thumb sm" style="display:flex;align-items:center;justify-content:center;color:var(--tx3)">—</div>') +
    '<div class="sp" data-open-fine="' + f.id + '" style="cursor:pointer">' +
    '<div class="nm">' + esc(f.name) + " · " + (KINDS[f.kind] || KINDS.etc).label + " " + won(f.amount) + "</div>" +
    '<div class="ds">' + fmtD(f.date) + " · 제출 " + tsFmt(f.proofAt) +
    (f.confirmedAt ? " · 확인 " + tsFmt(f.confirmedAt) + " (" + esc(f.confirmedBy || "") + ")" : "") + "</div></div>" +
    (showConfirm ? '<button class="btn xs ok" data-pconf="' + f.id + '">확인</button>' : '<span class="bdg g">완료</span>') +
    "</div>";

  return '<div class="sec-t">납부 확인 대기 ' + submitted.length + "건</div><div class='card pad0'>" +
    (submitted.length ? submitted.map(f => card(f, true)).join("") : '<div class="empty">대기 중인 건이 없습니다</div>') + "</div>" +
    '<div class="sec-t">미납 현황</div><div class="card pad0">' +
    (Object.values(unpaidByUser).filter(x => x.cnt).length
      ? Object.values(unpaidByUser).filter(x => x.cnt).sort((a, b) => b.amt - a.amt).map(x =>
        '<div class="row"><div class="avatar">' + esc(initial(x.u.name)) + "</div>" +
        '<div class="sp"><div class="nm">' + esc(x.u.name) + '</div><div class="ds">' + x.cnt + "건 미납</div></div>" +
        '<div style="font-weight:800;color:var(--dan)">' + won(x.amt) + "</div></div>").join("")
      : '<div class="empty">미납자가 없습니다 🎉</div>') + "</div>" +
    '<div class="sec-t">납부 완료 로그 (' + paid.length + "건)</div><div class='card pad0'>" +
    (paid.length ? paid.slice(0, 60).map(f => card(f, false)).join("") : '<div class="empty">기록 없음</div>') + "</div>";
}

const KR_HOLIDAYS = { "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일",
  "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절" };
const KR_LUNAR = {
  2026: [["02-16", "설날 연휴"], ["02-17", "설날"], ["02-18", "설날 연휴"], ["05-24", "부처님오신날"], ["09-24", "추석 연휴"], ["09-25", "추석"], ["09-26", "추석 연휴"]],
  2027: [["02-06", "설날 연휴"], ["02-07", "설날"], ["02-08", "설날 연휴"], ["05-13", "부처님오신날"], ["09-14", "추석 연휴"], ["09-15", "추석"], ["09-16", "추석 연휴"]]
};
async function presetHolidays() {
  const Y = new Date().getFullYear(); let n = 0;
  for (const y of [Y, Y + 1]) {
    for (const md in KR_HOLIDAYS) {
      const d = y + "-" + md;
      if (!DB.get("holidays", d)) { await DB.set("holidays", d, { date: d, name: KR_HOLIDAYS[md], work: false }); n++; }
    }
    for (const [md, nm] of (KR_LUNAR[y] || [])) {
      const d = y + "-" + md;
      if (!DB.get("holidays", d)) { await DB.set("holidays", d, { date: d, name: nm, work: false }); n++; }
    }
  }
  toast(n + "개 공휴일이 등록되었습니다", "ok");
}

/* ============================================================================
   개직 자동지급 — 매월 1일 기본 + 전월 무벌금 보너스 + 생일
   ============================================================================ */
async function runMonthlyGrant(force) {
  if (!Auth.isAdmin()) return 0;
  const S = SET();
  const ym = monthOf(today());
  const pm = prevMonth(ym);
  const Y = new Date().getFullYear(), M = new Date().getMonth() + 1;
  let n = 0;

  for (const u of ACTIVE_USERS()) {
    if (!force && u.lastGrant === ym) continue;
    if (u.lastGrant === ym && !force) continue;

    let total = 0;
    const parts = [];

    if (u.lastGrant !== ym) {
      if (Number(S.monthlyGaejik) > 0) { total += Number(S.monthlyGaejik); parts.push("월 정기 +" + S.monthlyGaejik); }

      /* 전월 무벌금 보너스 (전월에 이미 소속돼 있던 사람만) */
      const joinedYM = u.joinedAt ? monthOf(dstr(new Date(u.joinedAt))) : ym;
      if (Number(S.cleanBonus) > 0 && joinedYM <= pm) {
        const lastDay = new Date(Number(pm.split("-")[0]), Number(pm.split("-")[1]), 0).getDate();
        const pf = collectFines({ uid: u.uid, from: pm + "-01", to: pm + "-" + pad(lastDay) });
        const amt = sumFines(pf);
        if (amt === 0) { total += Number(S.cleanBonus); parts.push("전월 무벌금 +" + S.cleanBonus); }
      }
    }

    /* 생일 달 */
    if (Number(S.birthdayGaejik) > 0 && u.birth && Number(String(u.birth).split("-")[1]) === M && Number(u.bdayYear || 0) < Y) {
      total += Number(S.birthdayGaejik);
      parts.push("🎂 생일 +" + S.birthdayGaejik);
    }

    if (total > 0) {
      const after = Number(u.gaejik || 0) + total;
      const patch = { gaejik: after, lastGrant: ym };
      if (parts.some(x => x.indexOf("생일") >= 0)) patch.bdayYear = Y;
      await DB.set("users", u.uid, patch);
      await DB.add("glog", {
        uid: u.uid, name: u.name, delta: total, after,
        reason: ym.replace("-", "년 ") + "월 자동지급 · " + parts.join(" / "),
        auto: true, by: "시스템", at: Date.now(), date: today()
      });
      n++;
    } else if (u.lastGrant !== ym) {
      await DB.set("users", u.uid, { lastGrant: ym });
    }
  }
  return n;
}

      await DB.set("users", Auth.user.uid, { uid: Auth.user.uid, email: Auth.user.email, name: n, birth: b, joinedAt: Date.now() });
      pendingProfile = null;
      if (DB.mode === "sb") await DB.loadAll();
      toast("등록 완료", "ok");
    } catch (e) { toast(cleanErr(e), "err"); }
  };
}

let _rt = null, _pendingR = false;
function scheduleRender() {
  clearTimeout(_rt);
  _rt = setTimeout(() => {
    if ($("#ovl")) { _pendingR = true; return; }
    const a = document.activeElement;
    let key = null, ss = null;
    if (a && a.dataset && a.dataset.ct) key = '[data-ct="' + a.dataset.ct + '"]';
    else if (a && a.dataset && a.dataset.cktx) key = '[data-cktx="' + a.dataset.cktx + '"]';
    else if (a && a.id) key = "#" + a.id;
    try { ss = a && a.selectionStart; } catch (e) { }
    render();
    if (key) { const el = $(key); if (el) { try { el.focus(); if (ss != null && el.setSelectionRange) el.setSelectionRange(ss, ss); } catch (e) { } } }
  }, 160);
}
const _closeModal = closeModal;
closeModal = function () { _closeModal(); if (_pendingR) { _pendingR = false; scheduleRender(); } };

function syncProfile() {
  if (!Auth.user) { Auth.profile = null; return; }
  Auth.profile = DB.get("users", Auth.user.uid);
}

/* ============================================================================
   데모 데이터
   ============================================================================ */
async function seedDemo() {
  const tdy = today();
  const people = [
    ["장진수", "1994-08-25", "SM", 4], ["김도현", "1996-08-11", "TL", 3],
    ["이서준", "1993-02-14", "AP", 5], ["박민지", "1997-11-30", "AP", 1],
    ["최우진", "1995-08-03", "후보자", 2]
  ];
  const ids = [];
  for (let i = 0; i < people.length; i++) {
    const [n, b, g, gj] = people[i];
    const id = "demo" + (i + 1); ids.push(id);
    await DB.set("users", id, {
      uid: id, email: (i === 0 ? "admin" : "user" + i) + "@demo.com", pw: "123456",
      name: n, birth: b, grade: g, approved: true, gaejik: gj,
      joinedAt: Date.now() - 86400000 * 60, bdayYear: 0,
      checklist: i === 0 ? ["내일 상담 리스트 정리", "미팅 자료 준비", "일일 실적 입력"] : [],
      tlMembers: g === "TL" ? [ids[2] || "demo3"] : []
    });
  }
  await DB.set("users", "demo9", {
    uid: "demo9", email: "new@demo.com", pw: "123456", name: "신입사원",
    birth: "1999-05-05", grade: "후보자", approved: false, gaejik: 0, joinedAt: Date.now(), bdayYear: 0
  });
  await DB.set("settings", "global", { account: "국민은행 123456-01-234567 장진수", startDate: addDays(tdy, -20) });

  const times = [[7, 52], [8, 7], [7, 58], [8, 23], [8, 41], [7, 45]];
  for (let d = 20; d >= 0; d--) {
    const ds = addDays(tdy, -d);
    if (!isWorkday(ds, HOLIDAYS())) continue;
    for (let i = 0; i < ids.length; i++) {
      const r = (d * 7 + i * 3) % 10;
      const type = r === 0 ? "개직" : r === 1 ? "직출" : r === 2 ? "병원근무" : "출근";
      const t = times[(d + i) % times.length];
      const dt = parseD(ds); dt.setHours(t[0], t[1], 0, 0);
      const cl = parseD(ds); cl.setHours(21, 30, 0, 0);
      await DB.set("daily", dayId(ids[i], ds), {
        uid: ids[i], date: ds, type,
        reportAt: reportDeadlineTs(ds, type, DEFAULT_SETTINGS) - 3600000 * (r < 8 ? 2 : -1),
        gaejikUsed: type === "개직",
        checkinAt: type === "개직" ? null : dt.getTime(),
        hospital: type === "병원근무" ? "OO정형외과 3층" : "",
        reason: type === "직출" ? "OO고객 10시 방문상담 · 어제 21시 통화 완료" : "",
        photos: type === "개직" ? [] : new Array(r % 4 === 3 ? 2 : 3).fill(0).map((_, k) => {
          const pt = parseD(ds); pt.setHours(11 + k * 3, 20, 0, 0);
          return { u: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' fill='%23dde3ec'/><text x='60' y='66' font-size='38' text-anchor='middle' fill='%238b94a6'>IMG</text></svg>", at: pt.getTime() };
        }),
        closingItems: [{ t: "내일 상담 리스트 정리", done: true }, { t: "일일 실적 입력", done: r % 3 !== 0 }],
        closingSavedAt: r % 5 !== 4 ? cl.getTime() : 0,
        updatedAt: Date.now() - 86400000 * d
      });
    }
  }
  await DB.add("glog", { uid: ids[0], name: "장진수", delta: 2, after: 4, reason: "8월 자동지급 · 월 정기 +1 / 전월 무벌금 +1", by: "시스템", auto: true, at: Date.now() - 86400000 * 19, date: addDays(tdy, -19) });
  Auth.user = { uid: ids[0], email: "admin@demo.com" };
  toast("데모 데이터 생성 완료 · SM(관리자)으로 로그인됨", "ok");
  DB.emit();
}

/* ============================================================================
   부팅
   ============================================================================ */
let _rtStarted = false;
async function afterSignedIn() {
  try {
    await DB.loadAll();
    if (!_rtStarted) { DB.subscribeRT(); _rtStarted = true; }
  } catch (e) { console.error(e); toast(cleanErr(e), "err"); }
}

(async function boot() {
  const cfg = savedCfg();
  DB.onChange(() => { syncProfile(); scheduleRender(); });
  const goDemo = msg => {
    DB.mode = "demo"; DB.ready = true; App.booting = false; render();
    if (msg) setTimeout(() => toast(msg, "err"), 400);
  };

  if (cfg && cfg.url && cfg.anonKey) {
    try {
      const sb = await initSupabase(cfg);
      sb.auth.onAuthStateChange(async (evt, session) => {
        const u = session && session.user;
        Auth.user = u ? { uid: u.id, email: u.email } : null;
        if (u) { if (evt === "SIGNED_IN" || evt === "INITIAL_SESSION" || !DB.ready) await afterSignedIn(); }
        else {
          DB.cache = { users: {}, daily: {}, fines: {}, glog: {}, holidays: {}, settings: {} };
          DB.ready = false; _rtStarted = false; App.payShown = false;
        }
        App.booting = false; syncProfile(); render();
        if (u) setTimeout(() => { try { runMonthlyGrant(false); } catch (e) { } }, 3000);
      });
      let sess = null;
      try { const r = await withTimeout(sb.auth.getSession(), 8000, "세션 확인"); sess = r && r.data && r.data.session; }
      catch (e) { console.warn(e.message); }
      if (!sess) { App.booting = false; render(); }
      setTimeout(() => { if (App.booting) { App.booting = false; render(); } }, 8000);

      setInterval(() => { if (DB.mode === "sb" && Auth.user && !document.hidden) DB.loadAll().catch(() => { }); }, 90000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && DB.mode === "sb" && Auth.user) DB.loadAll().catch(() => { });
      });
    } catch (e) { console.error(e); goDemo("Supabase 연결 실패 · 데모 모드로 실행합니다"); }
  } else goDemo();
})();

const _render = render;
render = function () {
  if (!App.booting && Auth.user && DB.ready && !DB.get("users", Auth.user.uid)) {
    const now = Date.now();
    if (!window._missSince) window._missSince = now;
    if (now - window._missSince < 4000) {
      $("#root").innerHTML = bootScreen();
      setTimeout(() => { if (DB.mode === "sb") DB.loadAll().catch(() => render()); else render(); }, 1300);
      return;
    }
    $("#root").innerHTML = completeProfileScreen();
    bindCompleteProfile();
    return;
  }
  window._missSince = 0;
  _render();
};
